<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title th:text="${lang=='en'?'China 24-Hour Visa-Free Transit Checker | All Nationalities':'中国24小时过境免签检查｜面向所有外国国籍'}"></title>
<meta name="description" th:content="${lang=='en'?'Check a short China connection by passport nationality, onward route and transit hours. See which document, port and temporary entry conditions still need confirmation.':'按护照国籍、后续路线和中转小时数核对中国24小时过境，明确仍需确认的证件、口岸和临时入境许可条件。'}">
<meta name="robots" content="index,follow"><link rel="canonical" th:href="${canonicalUrl}">
<link rel="alternate" hreflang="en" th:href="${hreflang['en']}"><link rel="alternate" hreflang="zh" th:href="${hreflang['zh']}"><link rel="alternate" hreflang="x-default" th:href="${hreflang['x-default']}">
<link rel="stylesheet" href="/css/index.css?20261107-review"><link rel="stylesheet" href="/css/footer.css?20260906">
<div th:replace="~{common/ga :: google-analytics}"></div>
<style>.transit-page{max-width:780px}.trip-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.trip-grid label{display:block;font-weight:700}.trip-grid input,.trip-grid select{width:100%;box-sizing:border-box;min-height:44px;padding:10px;margin-top:6px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.trip-grid input[type=checkbox]{width:auto;min-height:20px}.check-btn{display:block;width:100%;padding:14px;margin-top:20px;border:0;border-radius:10px;background:#047857;color:white;font-weight:700}.result{display:none;margin-top:20px;padding:18px;border:1px solid #fde68a;background:#fffbeb;border-radius:12px}.result.bad{background:#fef2f2;border-color:#fecaca}.result ul{padding-left:20px}.links{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}.trip-grid small{display:block;color:#64748b}.transit-page h1{line-height:1.2}.transit-page p{margin:14px 0}@media(max-width:640px){.trip-grid{grid-template-columns:1fr}}.result p{margin:10px 0;line-height:1.65}.result ul{padding-left:22px;margin:12px 0}.result h3{line-height:1.35}.check-btn:disabled{opacity:.6;cursor:wait}#eligibility-checker,#stay-calculator{scroll-margin-top:84px}</style>
</head>
<body data-page-kind="transit_checker"><div th:replace="~{common/header :: site-header}"></div>
<main class="container transit-page" id="main-content" tabindex="-1">
<h1 th:text="${lang=='en'?'Check a 24-hour connection through China':'检查在中国不超过24小时的中转'}"></h1>
<p th:text="${lang=='en'?'This general transit facility applies to nationals of all countries, subject to its conditions. It is separate from the 57-country 240-hour policy. Leaving the port restricted area requires a temporary entry permit.':'一般24小时过境面向世界各国人员，但须满足规定条件；它与57国240小时政策不同。离开口岸限定区域须申请临时入境许可。'}"></p>
<section id="eligibility-checker"><div class="trip-grid">
<div><label for="nationality" th:text="${lang=='en'?'Passport nationality':'护照国籍'}"></label><select id="nationality" required><option value="" th:text="${lang=='en'?'Select your nationality':'请选择国籍'}"></option><option th:each="p:${places}" th:if="${p['code'] != 'HK' and p['code'] != 'MO' and p['code'] != 'TW'}" th:value="${p['code']}" th:text="${p['name']}"></option></select></div>
<div><label for="passport" th:text="${lang=='en'?'Travel document':'旅行证件'}"></label><select id="passport"><option value="ordinary" th:text="${lang=='en'?'Ordinary passport':'普通护照'}"></option><option value="other" th:text="${lang=='en'?'Other international travel document':'其他国际旅行证件'}"></option></select><small th:text="${lang=='en'?'Validity and acceptance must be confirmed with the authorities.':'有效期及是否接受须向主管机关确认。'}"></small></div>
<div><label for="entryDate" th:text="${lang=='en'?'Arrival date (China time)':'抵达日期（中国时间）'}"></label><input id="entryDate" type="date" required th:value="${todayChina}"></div>
<div><label id="duration-label" for="days" th:text="${lang=='en'?'Total transit hours':'总中转小时数'}"></label><input id="days" type="number" min="0.1" max="24" step="0.1" value="12" required><small th:text="${lang=='en'?'Use actual arrival-to-departure hours for the whole mainland transit, not one allowance for each stop.':'按整段中国大陆过境的实际抵达至离开小时数填写，不能每站重新起算。'}"></small></div>
<div id="itineraryFields"><label for="origin" th:text="${lang=='en'?'Country / region immediately before China':'紧邻中国前一国家或地区'}"></label><select id="origin"><option value="" th:text="${lang=='en'?'Select':'请选择'}"></option><option th:each="p:${places}" th:value="${p['code']}" th:text="${p['name']}"></option></select></div>
<div id="transit240Fields"><label for="destination" th:text="${lang=='en'?'Country / region immediately after China':'紧邻中国后一国家或地区'}"></label><select id="destination"><option value="" th:text="${lang=='en'?'Select':'请选择'}"></option><option th:each="p:${places}" th:value="${p['code']}" th:text="${p['name']}"></option></select><label><input id="onward" type="checkbox"><span th:text="${lang=='en'?'I hold a confirmed onward international ticket with the required date and seat.':'我持有所需日期及座位已确认的国际联程客票。'}"></span></label></div>
</div>
<div hidden><select id="entryMode"><option value="transit24" selected>24-hour transit</option></select><select id="purpose"><option value="transit">Transit</option></select><input id="passportValid" type="checkbox"><div id="departureDateField"><input id="departureDate" type="date"></div><div id="transit24Fields"></div><div id="hainanFields"></div></div>
<button id="check-btn" class="check-btn" type="button" th:text="${lang=='en'?'Check my connection':'检查我的中转'}"></button><div id="check-result" class="result" aria-live="polite"></div>
<noscript><p th:text="${lang=='en'?'Enable JavaScript to use the checker, or read the official policy below.':'使用检查器需启用JavaScript，也可阅读下方官方政策。'}"></p></noscript></section>
<p><a href="https://www.nia.gov.cn/n741440/n741577/c1731205/content.html" th:text="${lang=='en'?'Official NIA transit policy':'国家移民管理局过境政策原文'}"></a> · <span th:text="${lang=='en'?'Rules last checked: '+lastVerified+'. Screening does not guarantee entry or a temporary entry permit.':'规则最近核对：'+lastVerified+'。筛查不保证入境或取得临时入境许可。'}"></span></p>
<p><a th:href="@{/articles/leave-airport-china-24-hour-transit(lang=${lang})}" th:text="${lang=='en'?'Can I leave the airport?':'可以离开机场吗？'}"></a> · <a th:href="@{/articles/separate-tickets-china-transit-visa-free(lang=${lang})}" th:text="${lang=='en'?'What if I booked separate tickets?':'分开买机票如何核对？'}"></a></p>
</main><div th:replace="~{common/footer :: footer}"></div>
<script th:inline="javascript">window.ChinaVisaPage={code:'',lang:/*[[${lang}]]*/'en',selectedEntryMode:'transit24',generalTransit:true};</script><script src="/js/eligibility.js?v=20261107-review"></script>
</body></html>
