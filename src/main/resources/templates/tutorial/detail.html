<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">老年AI助手</title>
    <meta name="keywords" th:content="${tutorial.title + '，老年教程，简单步骤'}">
    <meta name="description" th:content="${tutorial.title} + '，步骤简单，口语化，适合长辈学习'">
    <!-- 引入公共CSS -->
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
<div class="container">
    <a th:href="@{/tutorial/list(category=${#strings.isEmpty(categoryName) ? '手机使用' : categoryName})}"
       class="back-btn">← 返回「[[${#strings.isEmpty(categoryName) ? '手机使用' : categoryName}]]」列表</a>
    <div class="detail-title" th:text="${tutorial.title}">手机字体调大最简单方法</div>
    <div class="detail-content" th:text="${tutorial.content}">
        1. 打开手机设置；2. 找到“显示”；3. 点“字体大小”；4. 把滑块往右拉，字就变大了。
    </div>
    <button class="func-btn read-btn" onclick="readContent()">🔊 听教程朗读</button>
    <button class="func-btn ask-btn" onclick="openAskModal()">❓ 不是想要的答案？重新问问AI</button>
    <div class="ai-answer-area" id="aiAnswer">
        <div class="ai-title">AI的回答：</div>
        <div class="ai-content" id="answerText"></div>
    </div>
    <div class="ask-modal" id="askModal">
        <div class="modal-content">
            <div class="modal-title">你想重新问什么？</div>
            <input type="text" class="ask-input" id="askInput" placeholder="比如：手机字体调大后怎么调小？"
                   th:placeholder="'比如：' + ${tutorial.title.replace('？','') + '相关的问题？'}">
            <div class="btn-group">
                <button class="modal-btn cancel-btn" onclick="closeAskModal()">取消</button>
                <button class="modal-btn submit-btn" onclick="submitAsk()">提交提问</button>
            </div>
        </div>
    </div>

    <!-- 引入公共尾部 -->
    <div class="footer" th:insert="foot :: footer"></div>
</div>

<!-- 引入公共JS -->
<script src="/js/common.js"></script>
<!-- 引入详情页专属JS -->
<script src="/js/detail.js"></script>
</body>
</html>
