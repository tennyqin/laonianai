<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${lang=='en' ? (countryExtraRoot != null ? countryExtraRoot['homeSeoTitleEn'] : detailCountry.name + ' to China Visa Guide 2026') : (countryExtraRoot != null ? countryExtraRoot['homeSeoTitleZh'] : detailCountry.nameZh + '来华签证政策指南 2026')}"></title>
<meta name="description" th:content="${lang=='en' ? (countryExtraRoot != null ? countryExtraRoot['homeSeoDescEn'] : detailCountry.name + ' citizens traveling to China: check visa-free eligibility, stay duration, entry rules and visa options.') : (countryExtraRoot != null ? countryExtraRoot['homeSeoDescZh'] : detailCountry.nameZh + '公民来华免签资格、停留期限、入境规则及签证方案查询。')}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<script type="application/ld+json" th:utext="${structuredData}"></script>
<link rel="canonical" th:href="${canonicalUrl}">
<link rel="alternate" hreflang="en" th:href="${hreflang['en']}"><link rel="alternate" hreflang="zh" th:href="${hreflang['zh']}"><link rel="alternate" hreflang="x-default" th:href="${hreflang['x-default']}">
<link rel="stylesheet" href="/css/index.css?20260906"><link rel="stylesheet" href="/css/country-detail.css?20260906"><link rel="stylesheet" href="/css/footer.css?20260906"><link rel="icon" href="/favicon.ico" type="image/x-icon"><div th:replace="~{common/ga :: google-analytics}"></div>
<style>
.decision-page{max-width:980px;margin:auto}.decision-hero{padding:30px 26px;background:#fff;border:1px solid #d1fae5;border-radius:20px;margin-bottom:20px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#047857;font-weight:800}.decision-hero h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:8px 0 14px}.hero-question{font-size:20px;font-weight:750;margin:0 0 8px}.hero-answer{color:#4b5563;line-height:1.7;margin:0;max-width:800px}.decision-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.decision-stat{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:15px}.decision-stat b{display:block;font-size:12px;color:#6b7280;margin-bottom:6px}.decision-stat span{font-weight:750}.checker{border:1px solid #dbe4e1;border-radius:20px;padding:24px;background:#fff;margin:20px 0;box-shadow:0 6px 24px rgba(0,0,0,.04)}.checker h2{margin:0 0 6px}.checker-help{color:#6b7280;line-height:1.65;margin-top:0}.checker-progress{display:flex;gap:6px;margin:18px 0}.checker-progress span{height:4px;flex:1;border-radius:99px;background:#e5e7eb}.checker-progress span.active{background:#10b981}.checker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.checker-field label{font-size:13px;font-weight:700;color:#374151;display:block}.checker select,.checker input[type=number],.checker input[type=text]{width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-size:14px}.checker select:focus,.checker input:focus{outline:2px solid #a7f3d0;border-color:#10b981}.check-help{display:block;margin-top:5px;color:#6b7280;font-size:12px;line-height:1.5}.check-option{display:flex;align-items:flex-start;gap:9px;margin-top:10px;padding:11px;border:1px solid #e5e7eb;border-radius:10px;background:#f8fafc;font-size:13px;color:#374151}.check-option input{margin-top:3px}.check-btn{margin-top:18px;width:100%;padding:14px;border:0;border-radius:11px;background:#059669;color:#fff;font-weight:800;cursor:pointer;font-size:15px}.check-btn:hover{background:#047857}.check-result{display:none;margin-top:18px;padding:18px;border-radius:14px;border:1px solid #d1d5db;background:#f8fafc}.check-result.ok{background:#ecfdf5;border-color:#a7f3d0}.check-result.warn{background:#fffbeb;border-color:#fde68a}.check-result.bad{background:#fef2f2;border-color:#fecaca}.result-head{display:flex;gap:12px;align-items:flex-start}.result-icon{font-size:25px;line-height:1}.check-result strong{display:block;margin-bottom:5px;font-size:18px}.result-detail{color:#4b5563;line-height:1.7}.result-summary{margin-top:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.result-summary div{padding:10px;border:1px solid rgba(0,0,0,.08);border-radius:9px;background:rgba(255,255,255,.65);font-size:13px}.result-summary b{display:block;font-size:11px;color:#6b7280;margin-bottom:3px}.result-links{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap}.result-links a{display:inline-block;padding:10px 13px;border:1px solid #d1d5db;border-radius:9px;text-decoration:none;background:#fff;color:#047857;font-weight:750}.route-section{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;margin:20px 0}.route-section h2{margin:0 0 7px}.section-intro{color:#6b7280;line-height:1.7}.route-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px;margin-top:17px}.route-card{position:relative;display:flex;flex-direction:column;min-height:190px;box-sizing:border-box;border:1px solid #dfe7e4;border-radius:16px;padding:19px;text-decoration:none;color:#1f2937;background:linear-gradient(180deg,#fff 0%,#fbfdfc 100%);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.route-card:hover{transform:translateY(-2px);border-color:#6ee7b7;box-shadow:0 10px 28px rgba(16,185,129,.12)}.route-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:#ecfdf5;color:#047857;font-size:19px;margin-bottom:13px}.route-badge{position:absolute;right:14px;top:14px;padding:4px 8px;border-radius:99px;background:#f0fdf4;color:#047857;font-size:11px;font-weight:800}.route-card strong{font-size:18px;margin-bottom:8px}.route-meta{color:#6b7280;font-size:13px;line-height:1.65}.route-cta{margin-top:auto;padding-top:15px;color:#047857;font-weight:800;font-size:13px}.note-card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:16px 0}.related-grid{display:flex;flex-wrap:wrap;gap:8px}.related-link{padding:8px 12px;border:1px solid #e5e7eb;border-radius:999px;text-decoration:none;color:#374151;font-size:13px;background:#fff}.source-note{font-size:12px;color:#6b7280;line-height:1.6}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:640px){.decision-grid,.checker-grid,.result-summary{grid-template-columns:1fr}.decision-hero{padding:23px 18px}.checker,.route-section{padding:19px 16px}.route-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container decision-page">
<div class="breadcrumb-wrap"><div class="breadcrumb"><a th:href="@{/(lang=${lang})}" th:text="${lang=='en'?'Home':'首页'}"></a><span class="sep">/</span><span class="current" th:text="${lang=='en'?detailCountry.name:detailCountry.nameZh}"></span></div></div>
<section class="decision-hero"><div class="eyebrow" th:text="${lang=='en'?'China Entry Decision Guide':'中国入境决策指南'}"></div><h1 th:text="${lang=='en'?detailCountry.name + ' Citizens Traveling to China':detailCountry.nameZh + '公民来华签证与免签指南'}"></h1><p class="hero-question" th:text="${lang=='en'?countryProfile['heroQuestionEn']:countryProfile['heroQuestionZh']}"></p><p class="hero-answer" th:text="${lang=='en'?countryProfile['heroAnswerEn']:countryProfile['heroAnswerZh']}"></p><div class="decision-grid"><div class="decision-stat"><b th:text="${lang=='en'?'Available route(s)':'可用入境路径'}"></b><span th:text="${availableTypes.size()}"></span></div><div class="decision-stat"><b th:text="${lang=='en'?'Priority market':'优先市场'}"></b><span th:text="${countryProfile['priority'] == 999 ? '—' : '#' + countryProfile['priority']}"></span></div><div class="decision-stat"><b th:text="${lang=='en'?'Last verified':'最近核验'}"></b><span>2026-09-05</span></div></div></section>
<section class="checker" id="eligibility-checker" aria-labelledby="checker-title"><h2 id="checker-title" th:text="${lang=='en'?'China Entry Eligibility Checker':'中国入境资格检查器'}"></h2><p class="checker-help" th:text="${lang=='en'?'Answer a few questions and we will match your trip with the routes listed for this country. You will see what to check next, not just a yes/no label.':'回答几个问题，我们会把你的行程与当前国家页面列出的入境路径进行匹配，并告诉你下一步应该核对什么，而不只是给一个简单的“是/否”。'}"></p><div class="checker-progress" aria-hidden="true"><span class="active"></span><span class="active"></span><span class="active"></span><span class="active"></span></div>
<div class="checker-grid">
<div class="checker-field"><label for="passport" th:text="${lang=='en'?'1. Passport type':'1. 护照类型'}"></label><select id="passport"><option value="ordinary" th:text="${lang=='en'?'Ordinary passport':'普通护照'}"></option><option value="diplomatic" th:text="${lang=='en'?'Diplomatic / official passport':'外交 / 公务护照'}"></option><option value="other" th:text="${lang=='en'?'Other travel document':'其他旅行证件'}"></option></select><small class="check-help" th:text="${lang=='en'?'This checker is designed primarily for ordinary passport holders.':'本检查器主要针对普通护照持有人。'}"></small></div>
<div class="checker-field"><label for="purpose" th:text="${lang=='en'?'2. Main purpose':'2. 主要出行目的'}"></label><select id="purpose"><option value="tourism" th:text="${lang=='en'?'Tourism':'旅游'}"></option><option value="business" th:text="${lang=='en'?'Business':'商务'}"></option><option value="family" th:text="${lang=='en'?'Family visit':'探亲'}"></option><option value="transit" th:text="${lang=='en'?'Transit':'过境'}"></option><option value="study" th:text="${lang=='en'?'Study':'学习'}"></option><option value="work" th:text="${lang=='en'?'Work':'工作'}"></option><option value="other" th:text="${lang=='en'?'Other':'其他'}"></option></select></div>
<div class="checker-field"><label for="days" th:text="${lang=='en'?'3. Planned stay':'3. 计划停留天数'}"></label><input id="days" type="number" min="1" max="3650" value="7" inputmode="numeric"><small class="check-help" th:text="${lang=='en'?'Count the full planned stay in mainland China.':'填写你计划在中国大陆停留的总天数。'}"></small></div>
<div class="checker-field"><label for="route" th:text="${lang=='en'?'4. Entry route':'4. 入境方式'}"></label><select id="route"><option value="direct" th:text="${lang=='en'?'Direct entry from abroad':'从境外直接入境'}"></option><option value="transit" th:text="${lang=='en'?'Transit to another country/region':'过境前往其他国家/地区'}"></option></select></div>
<div class="checker-field"><label for="destination" th:text="${lang=='en'?'5. Final destination after China (transit only)':'5. 离开中国后的最终目的地（仅过境）'}"></label><input id="destination" type="text" autocomplete="off" th:placeholder="${lang=='en'?'e.g. Japan, Thailand':'例如：日本、泰国'}"><small class="check-help" th:text="${lang=='en'?'A transit itinerary normally needs a qualifying onward destination; enter it so you remember to verify the itinerary.':'过境行程通常需要符合条件的后续目的地；填写后可提醒你核对完整联程行程。'}"></small></div>
<div class="checker-field"><label th:text="${lang=='en'?'6. Travel documents':'6. 行程材料'}"></label><label class="check-option"><input id="onward" type="checkbox"><span th:text="${lang=='en'?'I have, or expect to have, the required onward/return travel evidence':'我已准备或预计可以准备所需的返程 / 后续行程证明'}"></span></label></div>
</div><button class="check-btn" type="button" onclick="checkEligibility()" th:text="${lang=='en'?'Check my eligibility':'检查我的资格'}"></button>
<div class="check-result" id="check-result" aria-live="polite"><div class="result-head"><span class="result-icon" id="result-icon"></span><div><strong id="result-title"></strong><div class="result-detail" id="result-text"></div></div></div><div class="result-summary" id="result-summary"></div><div class="result-links" id="result-links"></div></div>
</section>
<section class="route-section" id="routes"><h2 th:text="${lang=='en'?'Choose the route that matches your trip':'Choose the route that matches your trip'}"></h2><p class="section-intro" th:text="${lang=='en'?countryProfile['introEn']:countryProfile['introZh']}"></p><div class="route-grid">
<a class="route-card" th:each="policy:${availablePolicies}" th:attr="data-route=${policy.policyType},data-stay=${policy.stayDays}" th:href="@{/country/{code}/{type}(code=${code},type=${policy.policyType},lang=${lang})}"><span class="route-icon" th:text="${policy.policyType=='transit'?'↔':policy.policyType=='mutual'?'⇄':'✓'}"></span><span class="route-badge" th:text="${policy.policyType=='transit'?(lang=='en'?'Transit':'过境'):policy.policyType=='mutual'?(lang=='en'?'Treaty':'协定'):(lang=='en'?'Visa-free':'免签')}"></span><strong th:text="${lang=='en'?policy.policyType:policy.policyTypeZh}"></strong><div class="route-meta"><span th:text="${lang=='en'?'Maximum stay: '+policy.stayDays+' days':'最长停留：'+policy.stayDays+'天'}"></span><br><span th:text="${lang=='en'?policy.purpose:policy.purposeZh}"></span></div><span class="route-cta" th:text="${lang=='en'?'Review conditions →':'查看详细条件 →'}"></span></a>
</div></section>
<th:block th:if="${countryExtraRoot != null}"><th:block th:with="noteList=${lang=='en'?countryExtraRoot['homeImportantNotesEn']:countryExtraRoot['homeImportantNotesZh']}"><section class="note-card" th:if="${noteList != null and !#lists.isEmpty(noteList)}"><h2 th:text="${lang=='en'?'Before you travel':'出发前重点确认'}"></h2><div th:each="note:${noteList}" class="doc-item">✓ [[${note}]]</div></section></th:block></th:block>
<th:block th:if="${countryExtraRoot != null}"><th:block th:with="homeFaqList=${lang=='en'?countryExtraRoot['homeCustomFaqsEn']:countryExtraRoot['homeCustomFaqsZh']}"><section class="note-card faq-section-wrap" th:if="${homeFaqList != null and !#lists.isEmpty(homeFaqList)}"><h2 th:text="${lang=='en'?'Questions travelers ask':'旅客常见问题'}"></h2><div th:each="faq:${homeFaqList}" class="faq-item"><div class="faq-q-wrap" tabindex="0" role="button"><p class="faq-question" th:text="${faq.q}"></p><span class="faq-toggle">+</span></div><div class="faq-answer-wrap"><div class="faq-answer" th:text="${faq.a}"></div></div></div></section></th:block></th:block>
<section class="note-card" th:if="${relatedCountryCodes != null and !#lists.isEmpty(relatedCountryCodes)}"><h2 th:text="${lang=='en'?'Related country guides':'相关国家指南'}"></h2><div class="related-grid"><a class="related-link" th:each="rc:${relatedCountryCodes}" th:href="@{/country/{code}(code=${rc},lang=${lang})}" th:text="${countryNames[rc] != null ? countryNames[rc] : rc}"></a></div></section>
<section class="note-card"><h2 th:text="${lang=='en'?'Official verification':'官方核验'}"></h2><p class="source-note" th:text="${lang=='en'?'Policy information is based on public information and should be rechecked before travel. Final entry decisions are made by the competent authorities.':'政策信息根据公开资料整理，出行前应再次核对最新规定。最终入境决定由有关主管机关依法作出。'}"></p><a href="https://en.nia.gov.cn/" target="_blank" rel="noopener noreferrer" th:text="${lang=='en'?'China National Immigration Administration (NIA)':'中国国家移民管理局（NIA）'}"></a></section>
<section class="note-card"><h2 th:text="${lang=='en'?'More help':'继续查询'}"></h2><div class="doc-item"><a th:href="@{/visa-guide(lang=${lang})}" th:text="${lang=='en'?'China Visa Application Guide':'中国签证申请指南'}"></a></div><div class="doc-item"><a th:href="@{/(lang=${lang})}" th:text="${lang=='en'?'Browse all countries':'浏览全部国家'}"></a></div></section>
</div>
<script th:inline="javascript">
const CHECKER={lang:/*[[${lang}]]*/'en',code:/*[[${code}]]*/''};
function esc(v){return String(v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]});}
function routeInfo(){return Array.from(document.querySelectorAll('.route-card')).map(function(el){return {type:el.dataset.route,stay:Number(el.dataset.stay)||0,href:el.getAttribute('href')};});}
function resultLink(href,label){return '<a href="'+href+'">'+label+'</a>';}
function showResult(kind,icon,title,text,summary,links){var box=document.getElementById('check-result');box.className='check-result '+kind;document.getElementById('result-icon').textContent=icon;document.getElementById('result-title').textContent=title;document.getElementById('result-text').textContent=text;document.getElementById('result-summary').innerHTML=summary||'';document.getElementById('result-links').innerHTML=links||'';box.style.display='block';box.scrollIntoView({behavior:'smooth',block:'nearest'});}
function checkEligibility(){
 var lang=CHECKER.lang==='en';var passport=document.getElementById('passport').value;var purpose=document.getElementById('purpose').value;var days=Number(document.getElementById('days').value);var route=document.getElementById('route').value;var destination=document.getElementById('destination').value.trim();var onward=document.getElementById('onward').checked;var routes=routeInfo();var direct=routes.filter(function(r){return r.type==='unilateral'||r.type==='mutual';});var transit=routes.find(function(r){return r.type==='transit';});var visa='/visa-guide?lang='+encodeURIComponent(CHECKER.lang);
 if(!Number.isInteger(days)||days<1||days>3650){showResult('warn','⚠',lang?'Enter a valid stay length':'请输入有效的停留天数',lang?'Enter a whole number from 1 to 3650 days.':'请输入1至3650之间的整数天数.','','');return;}
 if(passport!=='ordinary'){showResult('warn','⚠',lang?'Your passport type needs a separate check':'你的护照类型需要进一步核验',lang?'This checker is designed for ordinary passports. Diplomatic, official and other travel documents may follow different rules.':'本检查器主要针对普通护照。外交、公务及其他旅行证件可能适用不同规则。',lang?'<div><b>Document:</b> '+esc(passport)+'</div>':'<div><b>证件：</b>'+esc(passport)+'</div>',resultLink(visa,lang?'Open visa guide →':'查看签证指南 →'));return;}
 if(route==='transit'){
  if(!transit){showResult('warn','⚠',lang?'No transit route is listed for this country':'当前国家没有列出过境路径',lang?'Do not assume transit eligibility. Review the regular visa options instead.':'不要自行假设符合过境免签，请查看普通签证方案。','',resultLink(visa,lang?'Check visa options →':'查看签证方案 →'));return;}
  if(!destination){showResult('warn','⚠',lang?'Add your onward destination':'请填写后续目的地',lang?'A transit assessment needs the country or region you will travel to after China so you can verify the qualifying itinerary.':'过境判断需要明确离开中国后的目的地，以便核对是否符合规定。','',resultLink('/country/'+CHECKER.code+'/transit?lang='+encodeURIComponent(CHECKER.lang),lang?'Review transit conditions →':'查看过境条件 →'));return;}
  if(!onward){showResult('warn','⚠',lang?'Check your onward travel evidence':'请先确认后续行程证明',lang?'Transit eligibility normally depends on a qualifying onward itinerary. Make sure you can show the required travel evidence.':'过境资格通常取决于符合条件的后续行程，请确认能够提供所需行程证明。','',resultLink('/country/'+CHECKER.code+'/transit?lang='+encodeURIComponent(CHECKER.lang),lang?'Review transit conditions →':'查看过境条件 →'));return;}
  if(transit.stay>0&&days>transit.stay){showResult('warn','⚠',lang?'Your stay is longer than the listed transit limit':'计划停留超过页面显示的过境期限',lang?'You entered '+days+' days, while this page lists up to '+transit.stay+' days for the transit route.':'你填写了'+days+'天，而本页过境路径显示最长'+transit.stay+'天。','<div><b>'+ (lang?'Your stay':'计划停留')+'</b>'+days+' days</div><div><b>'+ (lang?'Listed limit':'页面期限')+'</b>'+transit.stay+' days</div>',resultLink(visa,lang?'Check visa options →':'查看签证方案 →'));return;}
  showResult('ok','✓',lang?'A transit route may fit your trip':'你的行程可能适用过境路径',lang?'Your answers match the basic information available on this country page. You still need to verify the exact passport, itinerary, destination, ports and other transit conditions.':'你的答案与本国家页面的基本过境条件相符，但仍需核对护照、完整行程、目的地、口岸及其他过境要求。','<div><b>'+ (lang?'Stay':'停留')+'</b>'+days+' days</div><div><b>'+ (lang?'Onward destination':'后续目的地')+'</b>'+esc(destination)+'</div>',resultLink('/country/'+CHECKER.code+'/transit?lang='+encodeURIComponent(CHECKER.lang),lang?'Review transit conditions →':'查看过境条件 →'));return;
 }
 if(purpose==='work'||purpose==='study'||purpose==='other'){showResult('warn','⚠',lang?'A regular visa may be required':'可能需要普通签证',lang?'This purpose is outside the common short-stay routes shown by this checker. Check the exact visa category before travel.':'该目的不属于本检查器展示的常见短期路径，请在出发前确认具体签证类别。','<div><b>'+ (lang?'Purpose':'目的')+'</b>'+esc(purpose)+'</div>',resultLink(visa,lang?'Open China visa guide →':'查看中国签证指南 →'));return;}
 if(direct.length===0){showResult('warn','⚠',lang?'No direct visa-free route is listed':'当前没有列出直接免签路径',lang?'This country page does not list a direct visa-free route for this trip.':'当前国家页面没有列出适用于该行程的直接免签路径。','',resultLink(visa,lang?'Check visa options →':'查看签证方案 →'));return;}
 var match=direct.find(function(r){return r.stay===0||days<=r.stay;});
 if(!match){var max=Math.max.apply(null,direct.map(function(r){return r.stay;}));showResult('warn','⚠',lang?'Your planned stay is longer than the listed limit':'计划停留超过页面显示期限',lang?'Your trip is '+days+' days, while the longest listed direct route allows '+max+' days. A different route or regular visa may be needed.':'你的计划为'+days+'天，而当前直接路径最长显示'+max+'天，可能需要其他路径或普通签证。','<div><b>'+ (lang?'Planned stay':'计划停留')+'</b>'+days+' days</div><div><b>'+ (lang?'Longest listed route':'最长路径')+'</b>'+max+' days</div>',resultLink(visa,lang?'Check visa options →':'查看签证方案 →'));return;}
 if(!onward){showResult('warn','⚠',lang?'Review your return / onward travel documents':'请确认返程 / 后续行程材料',lang?'Your route may fit the listed short-stay rules, but you should be prepared to meet any travel-document and entry checks applicable to your case.':'你的行程可能符合页面列出的短期路径，但仍应准备并核对适用的行程材料及入境要求。','<div><b>'+ (lang?'Route':'路径')+'</b>'+esc(match.type)+'</div><div><b>'+ (lang?'Listed stay':'页面期限')+'</b>'+match.stay+' days</div>',resultLink(match.href,lang?'Review exact conditions →':'查看具体条件 →'));return;}
