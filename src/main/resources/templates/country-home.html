<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${lang=='en' ? (countryExtraRoot != null ? countryExtraRoot['homeSeoTitleEn'] : detailCountry.name + ' to China Visa Guide 2026') : (countryExtraRoot != null ? countryExtraRoot['homeSeoTitleZh'] : detailCountry.nameZh + '来华签证政策指南 2026')}"></title>
<meta name="description" th:content="${lang=='en' ? (countryExtraRoot != null ? countryExtraRoot['homeSeoDescEn'] : detailCountry.name + ' citizens traveling to China: check visa-free eligibility, stay duration, entry rules and visa options.') : (countryExtraRoot != null ? countryExtraRoot['homeSeoDescZh'] : detailCountry.nameZh + '公民来华免签资格、停留期限、入境规则及签证方案查询。')}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<script type="application/ld+json" th:utext="${structuredData}"></script>
<link rel="canonical" th:href="${canonicalUrl}">
<link rel="alternate" hreflang="en" th:href="${hreflang['en']}"><link rel="alternate" hreflang="zh" th:href="${hreflang['zh']}"><link rel="alternate" hreflang="x-default" th:href="${hreflang['x-default']}">
<link rel="stylesheet" href="/css/index.css?20260906"><link rel="stylesheet" href="/css/country-detail.css?20260906"><link rel="stylesheet" href="/css/footer.css?20260906"><link rel="icon" href="/favicon.ico" type="image/x-icon"><div th:replace="~{common/ga :: google-analytics}"></div>
<style>
.decision-page{max-width:980px;margin:auto}.decision-hero{padding:28px 24px;background:#fff;border:1px solid #d1fae5;border-radius:18px;margin-bottom:18px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#047857;font-weight:700}.decision-hero h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:8px 0 14px}.hero-question{font-size:20px;font-weight:700;margin:0 0 8px}.hero-answer{color:#4b5563;line-height:1.7;margin:0}.decision-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.decision-stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:15px}.decision-stat b{display:block;font-size:12px;color:#6b7280;margin-bottom:6px}.decision-stat span{font-weight:700}.checker{border:1px solid #e5e7eb;border-radius:18px;padding:22px;background:#fff;margin:18px 0}.checker h2{margin-top:0}.checker-help{color:#6b7280;line-height:1.65}.checker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.checker label{font-size:13px;font-weight:600;color:#374151;display:block}.checker select,.checker input{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.check-btn{margin-top:15px;width:100%;padding:13px;border:0;border-radius:10px;background:#059669;color:#fff;font-weight:700;cursor:pointer}.check-result{display:none;margin-top:15px;padding:16px;border-radius:12px;border:1px solid #d1d5db;background:#f8fafc}.check-result.ok{background:#ecfdf5;border-color:#a7f3d0}.check-result.warn{background:#fffbeb;border-color:#fde68a}.check-result.bad{background:#fef2f2;border-color:#fecaca}.check-result strong{display:block;margin-bottom:6px;font-size:17px}.result-detail{color:#4b5563;line-height:1.7}.result-links{margin-top:12px;display:flex;gap:9px;flex-wrap:wrap}.result-links a{display:inline-block;padding:9px 12px;border:1px solid #d1d5db;border-radius:9px;text-decoration:none;background:#fff;color:#047857;font-weight:700}.policy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.policy-card{display:block;border:1px solid #e5e7eb;border-radius:14px;padding:18px;text-decoration:none;color:inherit;background:#fff}.policy-card:hover{border-color:#6ee7b7;box-shadow:0 5px 18px rgba(0,0,0,.05)}.policy-card strong{display:block;font-size:18px;margin-bottom:8px}.policy-meta{font-size:13px;color:#6b7280;line-height:1.6}.section-intro{color:#6b7280;line-height:1.7}.related-grid{display:flex;flex-wrap:wrap;gap:8px}.related-link{padding:8px 12px;border:1px solid #e5e7eb;border-radius:999px;text-decoration:none;color:#374151;font-size:13px}.source-note{font-size:12px;color:#6b7280;line-height:1.6}@media(max-width:640px){.decision-grid,.checker-grid{grid-template-columns:1fr}.decision-hero{padding:22px 18px}}
</style>
</head>
<body>
<div class="container decision-page">
<div class="breadcrumb-wrap"><div class="breadcrumb"><a th:href="@{/(lang=${lang})}" th:text="${lang=='en'?'Home':'首页'}"></a><span class="sep">/</span><span class="current" th:text="${lang=='en'?detailCountry.name:detailCountry.nameZh}"></span></div></div>
<section class="decision-hero"><div class="eyebrow" th:text="${lang=='en'?'China Entry Decision Guide':'中国入境决策指南'}"></div><h1 th:text="${lang=='en'?detailCountry.name + ' Citizens Traveling to China':detailCountry.nameZh + '公民来华签证与免签指南'}"></h1><p class="hero-question" th:text="${lang=='en'?countryProfile['heroQuestionEn']:countryProfile['heroQuestionZh']}"></p><p class="hero-answer" th:text="${lang=='en'?countryProfile['heroAnswerEn']:countryProfile['heroAnswerZh']}"></p><div class="decision-grid"><div class="decision-stat"><b th:text="${lang=='en'?'Available route(s)':'可用入境路径'}"></b><span th:text="${availableTypes.size()}"></span></div><div class="decision-stat"><b th:text="${lang=='en'?'Priority':'优先级'}"></b><span th:text="${countryProfile['priority'] == 999 ? '—' : '#' + countryProfile['priority']}"></span></div><div class="decision-stat"><b th:text="${lang=='en'?'Last verified':'最近核验'}"></b><span>2026-09-05</span></div></div></section>
<section class="checker" id="eligibility-checker"><h2 th:text="${lang=='en'?'Check your China entry eligibility':'检查你的中国入境资格'}"></h2><p class="checker-help" th:text="${lang=='en'?'Get a practical first answer in about 30 seconds. We check passport type, purpose, stay length and entry route, then point you to the right policy page. This is guidance, not a border decision.':'约30秒完成初步判断。我们会检查护照类型、出行目的、停留时间和入境方式，然后把你引导到更合适的政策页面。结果仅供参考，不是边检决定。'}"></p><div class="checker-grid"><div><label for="passport" th:text="${lang=='en'?'Passport type':'护照类型'}"></label><select id="passport"><option value="ordinary" th:text="${lang=='en'?'Ordinary passport':'普通护照'}"></option><option value="diplomatic" th:text="${lang=='en'?'Diplomatic / official passport':'外交 / 公务护照'}"></option><option value="other" th:text="${lang=='en'?'Other travel document':'其他旅行证件'}"></option></select></div><div><label for="purpose" th:text="${lang=='en'?'Main purpose':'主要出行目的'}"></label><select id="purpose"><option value="tourism" th:text="${lang=='en'?'Tourism':'旅游'}"></option><option value="business" th:text="${lang=='en'?'Business':'商务'}"></option><option value="family" th:text="${lang=='en'?'Family visit':'探亲'}"></option><option value="transit" th:text="${lang=='en'?'Transit':'过境'}"></option><option value="study" th:text="${lang=='en'?'Study':'学习'}"></option><option value="work" th:text="${lang=='en'?'Work':'工作'}"></option><option value="other" th:text="${lang=='en'?'Other':'其他'}"></option></select></div><div><label for="days" th:text="${lang=='en'?'Planned stay (days)':'计划停留天数'}"></label><input id="days" type="number" min="1" max="3650" value="7"><small style="display:block;margin-top:5px;color:#6b7280" th:text="${lang=='en'?'Enter the total number of days you expect to stay in mainland China.':'填写你预计在中国大陆停留的总天数。'}"></small></div><div><label for="route" th:text="${lang=='en'?'How will you enter China?':'你将如何进入中国？'}"></label><select id="route"><option value="direct" th:text="${lang=='en'?'Direct entry from abroad':'从境外直接入境'}"></option><option value="transit" th:text="${lang=='en'?'Transit to a third country/region':'过境前往第三国/地区'}"></option></select></div></div><button class="check-btn" type="button" onclick="checkEligibility()" th:text="${lang=='en'?'Check my eligibility':'开始检查我的资格'}"></button><div class="check-result" id="check-result" aria-live="polite"><strong id="result-title"></strong><div class="result-detail" id="result-text"></div><div class="result-links" id="result-links"></div></div></section>
<section class="card"><h2 th:text="${lang=='en'?'Choose the route that matches your trip':'选择与你行程匹配的入境路径'}"></h2><p class="section-intro" th:text="${lang=='en'?countryProfile['introEn']:countryProfile['introZh']}"></p><div class="policy-grid"><a class="policy-card" th:each="policy:${availablePolicies}" th:href="@{/country/{code}/{type}(code=${code},type=${policy.policyType},lang=${lang})}"><strong th:text="${lang=='en'?policy.policyType:policy.policyTypeZh}"></strong><div class="policy-meta"><span th:text="${lang=='en'?'Stay: '+policy.stayDays+' days':'停留：'+policy.stayDays+'天'}"></span><br><span th:text="${lang=='en'?policy.purpose:policy.purposeZh}"></span></div><span style="display:inline-block;margin-top:12px;color:#047857;font-weight:700;font-size:13px" th:text="${lang=='en'?'View detailed conditions →':'查看详细条件 →'}"></span></a></div></section>
<th:block th:if="${countryExtraRoot != null}"><th:block th:with="noteList=${lang=='en'?countryExtraRoot['homeImportantNotesEn']:countryExtraRoot['homeImportantNotesZh']}"><section class="card" th:if="${noteList != null and !#lists.isEmpty(noteList)}"><h2 th:text="${lang=='en'?'Before you travel':'出发前重点确认'}"></h2><div th:each="note:${noteList}" class="doc-item">✓ [[${note}]]</div></section></th:block></th:block>
<th:block th:if="${countryExtraRoot != null}"><th:block th:with="homeFaqList=${lang=='en'?countryExtraRoot['homeCustomFaqsEn']:countryExtraRoot['homeCustomFaqsZh']}"><section class="card faq-section-wrap" th:if="${homeFaqList != null and !#lists.isEmpty(homeFaqList)}"><h2 th:text="${lang=='en'?'Questions travelers ask':'旅客常见问题'}"></h2><div th:each="faq:${homeFaqList}" class="faq-item"><div class="faq-q-wrap" tabindex="0" role="button"><p class="faq-question" th:text="${faq.q}"></p><span class="faq-toggle">+</span></div><div class="faq-answer-wrap"><div class="faq-answer" th:text="${faq.a}"></div></div></div></section></th:block></th:block>
<section class="card" th:if="${relatedCountryCodes != null and !#lists.isEmpty(relatedCountryCodes)}"><h2 th:text="${lang=='en'?'Related country guides':'相关国家指南'}"></h2><div class="related-grid"><a class="related-link" th:each="rc:${relatedCountryCodes}" th:href="@{/country/{code}(code=${rc},lang=${lang})}" th:text="${countryNames[rc] != null ? countryNames[rc] : rc}"></a></div></section>
<section class="card"><h2 th:text="${lang=='en'?'Official verification':'官方核验'}"></h2><p class="source-note" th:text="${lang=='en'?'Policy information is based on public information and should be rechecked before travel. Final entry decisions are made by the competent authorities.':'政策信息根据公开资料整理，出行前应再次核对最新规定。最终入境决定由有关主管机关依法作出。'}"></p><a href="https://en.nia.gov.cn/" target="_blank" rel="noopener noreferrer" th:text="${lang=='en'?'China National Immigration Administration (NIA)':'中国国家移民管理局（NIA）'}"></a></section>
<section class="card"><h2 th:text="${lang=='en'?'More help':'继续查询'}"></h2><div class="doc-item"><a th:href="@{/visa-guide(lang=${lang})}" th:text="${lang=='en'?'China Visa Application Guide':'中国签证申请指南'}"></a></div><div class="doc-item"><a th:href="@{/(lang=${lang})}" th:text="${lang=='en'?'Browse all countries':'浏览全部国家'}"></a></div></section>
</div>
<script th:inline="javascript">
const CHECKER={
 lang:/*[[${lang}]]*/'en',
 code:/*[[${code}]]*/'',
 maxStay:/*[[${availablePolicies.size()>0 ? availablePolicies.get(0).stayDays : 0}]]*/0,
 hasUnilateral:/*[[${availableTypes.contains('unilateral')}]]*/false,
 hasMutual:/*[[${availableTypes.contains('mutual')}]]*/false,
 hasTransit:/*[[${availableTypes.contains('transit')}]]*/false
};
function addLink(href,label){return '<a href="'+href+'">'+label+'</a>';}
function checkEligibility(){
 const lang=CHECKER.lang==='en',p=document.getElementById('passport').value,purpose=document.getElementById('purpose').value,days=Number(document.getElementById('days').value),route=document.getElementById('route').value;
 const box=document.getElementById('check-result'),title=document.getElementById('result-title'),text=document.getElementById('result-text'),links=document.getElementById('result-links');
 box.className='check-result';links.innerHTML='';
 if(!Number.isInteger(days)||days<1||days>3650){box.classList.add('warn');title.textContent=lang?'Enter a valid stay length':'请输入有效的停留天数';text.textContent=lang?'Choose a number from 1 to 3650 days.':'请输入1至3650之间的天数。';box.style.display='block';return;}
 if(p!=='ordinary'){
  box.classList.add('warn');title.textContent=lang?'Your travel document needs a separate check':'你的旅行证件需要进一步核验';text.textContent=lang?'The standard checker is designed for ordinary passports. Diplomatic, official and other travel documents can follow different rules. Check the applicable official policy before relying on visa-free entry.':'本检查器主要针对普通护照。外交、公务及其他旅行证件可能适用不同规则，依赖免签入境前请核对适用的官方政策。';links.innerHTML=addLink('/visa-guide?lang='+encodeURIComponent(CHECKER.lang),lang?'Open visa guide →':'查看签证指南 →');box.style.display='block';return;
 }
 if(route==='transit'||purpose==='transit'){
  if(CHECKER.hasTransit){box.classList.add('ok');title.textContent=lang?'A transit route may fit your trip':'你的行程可能适用过境路径';text.textContent=lang?'Because you selected transit, check the transit policy carefully. Transit rules normally depend on your passport, itinerary, eligible destination and other conditions—not just the number of days.':'你选择了过境，请重点核对过境政策。过境免签通常不仅取决于停留天数，还可能取决于护照、联程行程、目的地等条件。';links.innerHTML=addLink('/country/'+CHECKER.code+'/transit?lang='+encodeURIComponent(CHECKER.lang),lang?'Review transit conditions →':'查看过境条件 →');
  }else{box.classList.add('warn');title.textContent=lang?'No transit route is listed for this country':'当前国家页面没有列出过境路径';text.textContent=lang?'Do not assume transit eligibility. Check another route or the regular visa guide.':'不要自行假设符合过境免签，请查看其他路径或普通签证指南。';links.innerHTML=addLink('/visa-guide?lang='+encodeURIComponent(CHECKER.lang),lang?'Open visa guide →':'查看签证指南 →');}
  box.style.display='block';return;
 }
 if(['work','study','other'].includes(purpose)){
  box.classList.add('warn');title.textContent=lang?'A regular visa may be required':'可能需要普通签证';text.textContent=lang?'This purpose is commonly outside the standard short-stay visa-free scenarios shown here. Check the exact policy and do not rely on a tourist-style visa-free route.':'该目的通常不属于这里展示的常见短期免签场景。请核对具体政策，不要直接按旅游免签路径入境。';links.innerHTML=addLink('/visa-guide?lang='+encodeURIComponent(CHECKER.lang),lang?'Open China visa guide →':'查看中国签证指南 →');box.style.display='block';return;
 }
 if(CHECKER.maxStay>0&&days>CHECKER.maxStay){box.classList.add('warn');title.textContent=lang?'Your planned stay is longer than the listed limit':'计划停留超过页面显示期限';text.textContent=lang?'Your trip is '+days+' days, while the selected route lists '+CHECKER.maxStay+' days. Consider another eligible route or a regular visa.':'你的计划为'+days+'天，而当前路径页面显示最长'+CHECKER.maxStay+'天。请考虑其他适用路径或普通签证。';links.innerHTML=addLink('/visa-guide?lang='+encodeURIComponent(CHECKER.lang),lang?'Check visa options →':'查看签证方案 →');box.style.display='block';return;}
 if(CHECKER.hasUnilateral){box.classList.add('ok');title.textContent=lang?'You may qualify for the listed visa-free route':'你可能符合页面列出的免签路径';text.textContent=lang?'Your answers match a common short-stay scenario. This is not automatic approval: open the detailed policy and verify passport, purpose, stay, entry and document conditions before departure.':'你的答案符合常见短期出行场景，但这不代表自动获准。出发前请进入政策详情，逐项核对护照、目的、停留、入境及材料要求。';links.innerHTML=addLink('/country/'+CHECKER.code+'/unilateral?lang='+encodeURIComponent(CHECKER.lang),lang?'Review visa-free conditions →':'查看免签条件 →');
 }else if(CHECKER.hasMutual){box.classList.add('ok');title.textContent=lang?'A mutual visa-exemption route may apply':'可能适用互免签证路径';text.textContent=lang?'Your answers match a common short-stay scenario. Mutual-exemption rules can depend on the treaty and passport category, so verify the detailed policy before travel.':'你的答案符合常见短期出行场景，但互免签证可能受协定及护照类别限制，请出发前核对具体政策。';links.innerHTML=addLink('/country/'+CHECKER.code+'/mutual?lang='+encodeURIComponent(CHECKER.lang),lang?'Review mutual exemption →':'查看互免签证 →');
 }else{box.classList.add('warn');title.textContent=lang?'No standard visa-free route was identified':'暂未识别到标准免签路径';text.textContent=lang?'Based on the options on this page, check the regular visa guide or another applicable route.':'根据当前页面可用路径，请查看普通签证指南或其他适用入境路径。';links.innerHTML=addLink('/visa-guide?lang='+encodeURIComponent(CHECKER.lang),lang?'Open visa guide →':'查看签证指南 →');}
 box.style.display='block';
}
document.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('.faq-q-wrap').forEach(w=>{w.addEventListener('click',()=>w.closest('.faq-item').classList.toggle('open'));w.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();w.click()}})}));
</script>
<div th:replace="~{common/footer :: footer}"></div>
</body></html>
