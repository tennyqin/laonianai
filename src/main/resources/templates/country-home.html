<style>
.page{max-width:980px;margin:auto}.site-header{border-bottom:1px solid #e5e7eb;background:#fff;position:sticky;top:0;z-index:20}.site-header-inner{max-width:1180px;margin:auto;min-height:62px;padding:0 18px;display:flex;align-items:center;gap:24px}.site-logo{font-weight:850;color:#064e3b;text-decoration:none;white-space:nowrap}.site-nav{display:flex;gap:18px;align-items:center;flex:1}.site-nav a,.site-lang a{color:#374151;text-decoration:none;font-size:14px}.site-nav a:hover,.site-lang a:hover,.site-lang .active{color:#047857}.site-lang{display:flex;gap:6px;white-space:nowrap}.breadcrumb-wrap{margin-top:18px}.hero{padding:30px 26px;background:#fff;border:1px solid #d1fae5;border-radius:20px;margin-bottom:18px}.country-heading{display:flex;align-items:center;gap:12px}.country-flag{font-size:42px;line-height:1}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#047857;font-weight:800}.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:8px 0 12px}.question{font-size:20px;font-weight:750;margin:0 0 8px}.answer,.intro,.muted{color:#64748b;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}.stat{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:14px}.stat b{display:block;font-size:11px;color:#64748b;margin-bottom:5px}.stat span{font-weight:800}.box{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:23px;margin:18px 0}.box h2{margin:0 0 6px}.checker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.field label{display:block;font-size:13px;font-weight:750;color:#374151}.field select,.field input{width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-size:14px}.help{font-size:12px;color:#64748b;line-height:1.5;margin-top:5px;display:block}.conditional{display:none}.check-btn{margin-top:17px;width:100%;border:0;border-radius:11px;padding:14px;background:#059669;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.result{display:none;margin-top:17px;padding:18px;border-radius:14px;border:1px solid #d1d5db;background:#f8fafc}.result.ok{background:#ecfdf5;border-color:#a7f3d0}.result.warn{background:#fffbeb;border-color:#fde68a}.result.bad{background:#fef2f2;border-color:#fecaca}.result-title{font-size:19px;font-weight:850;margin-bottom:6px}.result-text{color:#475569;line-height:1.7}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.summary div{background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:10px;font-size:12px}.summary b{display:block;color:#64748b;font-size:10px;margin-bottom:3px}.links,.related{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.links a,.related a{padding:9px 12px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#047857;text-decoration:none;font-weight:750;font-size:13px}.route-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:15px}.route{display:flex;flex-direction:column;min-height:175px;border:1px solid #dfe7e4;border-radius:16px;padding:18px;text-decoration:none;color:#1f2937;background:#fff}.route-icon{width:38px;height:38px;border-radius:11px;background:#ecfdf5;color:#047857;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.route strong{font-size:18px;margin-bottom:7px}.route-meta{font-size:13px;color:#64748b;line-height:1.6}.route-cta{margin-top:auto;padding-top:13px;color:#047857;font-size:13px;font-weight:800}.notes{margin:0;padding-left:20px}.notes li{margin:8px 0;color:#475569;line-height:1.6}.faq details{border-top:1px solid #e5e7eb;padding:13px 0}.faq summary{cursor:pointer;font-weight:750}.source{font-size:12px;color:#64748b;line-height:1.6}@media(max-width:720px){.site-header-inner{flex-wrap:wrap;padding:10px 14px}.site-nav{order:3;width:100%;overflow:auto;gap:14px}.stats,.checker-grid,.summary{grid-template-columns:1fr}.hero,.box{padding:19px 16px}.country-flag{font-size:34px}}

<body>
<div th:replace="~{common/header :: site-header}"></div>
<div class="container page">
<div class="breadcrumb-wrap"><div class="breadcrumb"><a th:href="@{/(lang=${lang})}" th:text="${lang=='en'?'Home':'首页'}"></a><span class="sep">/</span><span class="current"><span th:text="${lang=='en'?detailCountry.name:detailCountry.nameZh}"></span></span></div></div>
<section class="hero">
<div class="country-heading"><span class="country-flag" aria-hidden="true" th:text="${countryFlag}"></span><div><div class="eyebrow" th:text="${lang=='en'?'China Entry Decision Guide':'中国入境决策指南'}"></div><h1 th:text="${lang=='en'?detailCountry.name+' Citizens Traveling to China':detailCountry.nameZh+'公民来华签证与免签指南'}"></h1></div></div>
<p class="question" th:text="${lang=='en'?countryProfile['heroQuestionEn']:countryProfile['heroQuestionZh']}"></p>
<p class="answer" th:text="${lang=='en'?countryProfile['heroAnswerEn']:countryProfile['heroAnswerZh']}"></p>
<div class="stats"><div class="stat"><b th:text="${lang=='en'?'Available routes':'可用路径'}"></b><span th:text="${availableTypes.size()}"></span></div><div class="stat"><b th:text="${lang=='en'?'Last verified':'最近核验'}"></b><span>2026-09-06</span></div></div>
</section>
<section class="box" id="eligibility-checker">
<h2 th:text="${lang=='en'?'China Entry Eligibility Checker':'中国入境资格检查器'}"></h2>
<p class="intro" th:text="${lang=='en'?'Answer a few questions to find the route that may apply to your trip. Results are a screening aid, not an immigration decision.':'回答几个问题，快速找到可能适用于你行程的入境路径。结果仅用于出行前筛查，不等同于边检决定。'}"></p>
<div class="checker-grid">
<div class="field"><label for="passport" th:text="${lang=='en'?'1. Passport type':'1. 护照类型'}"></label><select id="passport"><option value="ordinary" th:text="${lang=='en'?'Ordinary passport':'普通护照'}"></option><option value="diplomatic" th:text="${lang=='en'?'Diplomatic / official passport':'外交 / 公务护照'}"></option><option value="other" th:text="${lang=='en'?'Other travel document':'其他旅行证件'}"></option></select></div>
<div class="field"><label for="purpose" th:text="${lang=='en'?'2. Main purpose':'2. 主要目的'}"></label><select id="purpose"><option value="tourism" th:text="${lang=='en'?'Tourism':'旅游'}"></option><option value="business" th:text="${lang=='en'?'Business':'商务'}"></option><option value="family" th:text="${lang=='en'?'Family / friends visit':'探亲访友'}"></option><option value="exchange" th:text="${lang=='en'?'Exchange visit':'交流访问'}"></option><option value="transit" th:text="${lang=='en'?'Transit':'过境'}"></option><option value="study" th:text="${lang=='en'?'Study':'学习'}"></option><option value="work" th:text="${lang=='en'?'Work':'工作'}"></option><option value="other" th:text="${lang=='en'?'Other':'其他'}"></option></select></div>
<div class="field"><label for="days" th:text="${lang=='en'?'3. Planned stay':'3. 计划停留'}"></label><input id="days" type="number" min="1" max="3650" value="7" inputmode="numeric"><small class="help" th:text="${lang=='en'?'For complex bilateral rules, the checker will ask you to verify the agreement rather than guessing.':'对于复杂的双边互免规则，检查器会要求进一步核验，不会自行猜测。'}"></small></div>
<div class="field"><label for="entryMode" th:text="${lang=='en'?'4. Entry route':'4. 入境路径'}"></label><select id="entryMode"><option value="direct" th:text="${lang=='en'?'Direct entry':'直接入境'}"></option><option value="transit240" th:text="${lang=='en'?'240-hour transit to a third country / region':'240小时过境前往第三国 / 地区'}"></option><option value="transit24" th:text="${lang=='en'?'24-hour transit without leaving the port restricted area':'24小时过境且不离开口岸限定区域'}"></option><option value="hainan" th:text="${lang=='en'?'Hainan regional visa-free entry':'海南区域免签'}"></option></select></div>
<div class="field conditional" id="transit240Fields"><label for="destination" th:text="${lang=='en'?'5. Onward destination':'5. 后续目的地'}"></label><input id="destination" type="text" autocomplete="off" th:placeholder="${lang=='en'?'e.g. Japan, Thailand':'例如：日本、泰国'}"><label style="margin-top:9px;display:flex;gap:8px;align-items:flex-start;font-weight:600"><input id="onward" type="checkbox" style="width:auto;margin-top:3px"><span th:text="${lang=='en'?'I have confirmed onward travel evidence':'我有已确认的后续联程行程证明'}"></span></label></div>
<div class="field conditional" id="transit24Fields"><label th:text="${lang=='en'?'24-hour transit condition':'24小时过境条件'}"></label><div class="help" th:text="${lang=='en'?'You must have valid international travel documents and a confirmed onward international ticket; leaving the restricted port area requires further immigration handling.':'需要有效国际旅行证件和已确定座位的国际联程客票；如需离开口岸限定区域，应按规定办理相关入境手续。'}"></div></div>
<div class="field conditional" id="hainanFields"><label th:text="${lang=='en'?'Hainan condition':'海南条件'}"></label><div class="help" th:text="${lang=='en'?'The route is limited to the Hainan administrative area and eligible short-term purposes.':'该路径仅适用于海南省行政区域，并受允许的短期事由限制。'}"></div></div>
</div>
<button class="check-btn" id="check-btn" type="button" th:text="${lang=='en'?'Check my eligibility':'检查我的资格'}"></button>
<div class="result" id="check-result" aria-live="polite"><div class="result-title" id="result-title"></div><div class="result-text" id="result-text"></div><div class="summary" id="result-summary"></div><div class="links" id="result-links"></div></div>
</section>
<section class="box" id="routes"><h2 th:text="${lang=='en'?'Available routes for this country':'这个国家可用的入境路径'}"></h2><p class="intro" th:text="${lang=='en'?countryProfile['introEn']:countryProfile['introZh']}"></p><div class="route-grid"><a class="route" th:each="policy:${availablePolicies}" th:href="@{/country/{code}/{type}(code=${code},type=${policy.policyType},lang=${lang})}"><span class="route-icon" th:text="${policy.policyType=='transit'?'↔':policy.policyType=='mutual'?'⇄':'✓'}"></span><strong th:text="${lang=='en'?policy.policyType:policy.policyTypeZh}"></strong><div class="route-meta"><span th:text="${lang=='en'?'Maximum listed stay: '+policy.stayDays+' days':'政策记录最长停留：'+policy.stayDays+'天'}"></span><br><span th:text="${lang=='en'?policy.purpose:policy.purposeZh}"></span></div><span class="route-cta" th:text="${lang=='en'?'View detailed rules →':'查看详细规则 →'}"></span></a></div></section>
<section class="box" th:if="${countryExtraRoot!=null && countryExtraRoot['homeImportantNotesEn']!=null}"><h2 th:text="${lang=='en'?'Important before you travel':'出行前重要提示'}"></h2><ul><li th:each="n:${lang=='en'?countryExtraRoot['homeImportantNotesEn']:countryExtraRoot['homeImportantNotesZh']}" th:text="${n}"></li></ul></section>
<section class="box"><h2 th:text="${lang=='en'?'Common questions':'常见问题'}"></h2><div class="faq"><details open><summary th:text="${lang=='en'?'Does visa-free entry guarantee admission?':'免签是否保证一定可以入境？'}"></summary><p class="muted" th:text="${lang=='en'?'No. Final admission remains subject to immigration inspection and the rules in force on the travel date.':'不保证。最终是否准许入境仍由边检机关依据出行当日有效规定决定。'}"></p></details><details><summary th:text="${lang=='en'?'What if I will work or study in China?':'如果我要在中国工作或学习怎么办？'}"></summary><p class="muted" th:text="${lang=='en'?'Do not use an ordinary visa-free route for work or study. Check the appropriate visa category.':'工作或学习不要套用普通免签路径，请查看对应签证类别。'}"></p></details></div></section>
<section class="box" th:if="${relatedCountryCodes!=null && !relatedCountryCodes.isEmpty()}"><h2 th:text="${lang=='en'?'Related country guides':'相关国家指南'}"></h2><div class="related"><a th:each="c:${relatedCountryCodes}" th:href="@{/country/{code}(code=${c},lang=${lang})}"><span aria-hidden="true" th:text="${countryFlags[c]}"></span> <span th:text="${countryNames[c]!=null?countryNames[c]:c}"></span></a></div></section>
<section class="box"><p class="source"><strong th:text="${lang=='en'?'Official verification':'官方核验'}"></strong><br><a href="https://en.nia.gov.cn/" rel="noopener noreferrer" target="_blank">China National Immigration Administration (NIA)</a><br><span th:text="${lang=='en'?'Policy information can change. Recheck the official source before travel. Site verification: 2026-09-06.':'政策可能变化，出行前请再次核对官方信息。本网站最近一次核验：2026-09-06。'}"></span></p></section>
</div>
<div th:replace="~{common/footer :: footer}"></div>
<script th:inline="javascript">
var CONFIG=/*[[${eligibilityConfig}]]*/{};var LANG=/*[[${lang}]]*/'en';var CODE=/*[[${code}]]*/'';var result=document.getElementById('check-result'),titleEl=document.getElementById('result-title'),textEl=document.getElementById('result-text'),summaryEl=document.getElementById('result-summary'),linksEl=document.getElementById('result-links'),mode=document.getElementById('entryMode');
var I18N={en:{passport:'Passport',stay:'Stay',purpose:'Purpose',limit:'Limit',onward:'Onward evidence',confirmed:'Confirmed',notConfirmed:'Not confirmed',destination:'Destination',region:'Region',route:'Route',mutual:'Mutual exemption',entered:'Stay entered',hainan:'Hainan',days:'days',hours:'hours'},zh:{passport:'护照',stay:'停留时间',purpose:'出行目的',limit:'限制期限',onward:'后续行程证明',confirmed:'已确认',notConfirmed:'未确认',destination:'后续目的地',region:'地区',route:'路径',mutual:'互免签证',entered:'填写的停留时间',hainan:'海南',days:'天',hours:'小时'}};
var T=I18N[LANG==='zh'?'zh':'en'];function showFields(){document.getElementById('transit240Fields').style.display=mode.value==='transit240'?'block':'none';document.getElementById('transit24Fields').style.display=mode.value==='transit24'?'block':'none';document.getElementById('hainanFields').style.display=mode.value==='hainan'?'block':'none';}function showResult(kind,title,text,summary,links){result.className='result '+kind;result.style.display='block';titleEl.textContent=title;textEl.textContent=text;summaryEl.innerHTML='';linksEl.innerHTML='';for(var i=0;i<summary.length;i++){var d=document.createElement('div'),b=document.createElement('b');b.textContent=summary[i].k;d.appendChild(b);d.appendChild(document.createTextNode(summary[i].v));summaryEl.appendChild(d)}for(var j=0;j<links.length;j++){var a=document.createElement('a');a.href=links[j].url;a.textContent=links[j].text;linksEl.appendChild(a)}}function directRule(purpose,days){var list=CONFIG.policies||[];for(var i=0;i<list.length;i++){var p=list[i];if(p.type!=='unilateral'&&p.type!=='mutual')continue;if(!p.stayDays)continue;if((p.purposes||[]).indexOf(purpose)<0)continue;if(days<=Number(p.stayDays))return p}return null}function check(){var passport=document.getElementById('passport').value,purpose=document.getElementById('purpose').value,days=Number(document.getElementById('days').value);if(!isFinite(days)||days<1||days>3650){showResult('bad',LANG==='en'?'Enter a valid stay length':'请输入有效停留天数','',[],[]);return}if(passport!=='ordinary'){showResult('warn',LANG==='en'?'Passport type needs separate verification':'该护照类型需要单独核验',LANG==='en'?'This checker is based on ordinary-passport rules and cannot confirm an exemption for diplomatic, official or other travel documents.':'本检查器基于普通护照政策，不能直接确认外交、公务或其他旅行证件的免签资格.',[{k:T.passport,v:passport},{k:T.stay,v:days+' '+T.days}],[{url:'/visa-guide?lang='+LANG,text:LANG==='en'?'Visa guide':'签证指南'}]);return}if(purpose==='work'||purpose==='study'||purpose==='other'){showResult('bad',LANG==='en'?'A visa route is likely required':'通常需要申请签证',LANG==='en'?'The ordinary visa-free routes on this site do not cover this purpose.':'本站当前普通免签路径不覆盖该目的，请查看对应签证类别.',[{k:T.purpose,v:purpose},{k:T.stay,v:days+' '+T.days}],[{url:'/visa-guide?lang='+LANG,text:LANG==='en'?'Visa guide':'签证指南'}]);return}if(mode.value==='transit240'){var t=CONFIG.transit240||{};var dest=document.getElementById('destination').value.trim(),onward=document.getElementById('onward').checked;if(!t.enabled){showResult('bad',LANG==='en'?'240-hour transit is not listed for this country':'当前国家不在240小时过境免签范围内','',[],[{url:'/visa-guide?lang='+LANG,text:LANG==='en'?'Visa guide':'签证指南'}]);return}if(!dest||!onward){showResult('warn',LANG==='en'?'More transit evidence is required':'还需要补充过境行程证明',LANG==='en'?'A confirmed onward itinerary to a third country or region is required.':'需要前往第三国或地区的已确认联程行程.',[{k:T.limit,v:'10 '+T.days},{k:T.onward,v:onward?T.confirmed:T.notConfirmed}],[{url:'/country/'+CODE+'/transit?lang='+LANG,text:LANG==='en'?'View transit rules':'查看过境规则'}]);return}if(days>10){showResult('bad',LANG==='en'?'Stay exceeds the 240-hour limit':'停留超过240小时期限',LANG==='en'?'The maximum is 240 hours (10 days).':'最长停留时间为240小时（10天）。',[{k:T.stay,v:days+' '+T.days},{k:T.limit,v:'10 '+T.days}],[{url:'/country/'+CODE+'/transit?lang='+LANG,text:LANG==='en'?'View transit rules':'查看过境规则'}]);return}showResult('ok',LANG==='en'?'Likely eligible for 240-hour transit':'可能符合240小时过境免签',LANG==='en'?'Your answers match the basic country, passport, itinerary and stay conditions. Verify the exact eligible port and permitted area before departure.':'你的信息符合国家、护照、行程和停留时间的基本条件。出发前仍需核对具体适用口岸和允许活动区域.',[{k:T.limit,v:'10 '+T.days},{k:T.destination,v:dest}],[{url:'/country/'+CODE+'/transit?lang='+LANG,text:LANG==='en'?'View transit rules':'查看过境规则'}]);return}if(mode.value==='transit24'){if(days>1){showResult('bad',LANG==='en'?'Stay exceeds 24 hours':'停留超过24小时',LANG==='en'?'The general 24-hour transit facility is limited to no more than 24 hours.':'一般24小时过境便利最长不超过24小时。',[{k:T.stay,v:days+' '+T.days},{k:T.limit,v:'24 '+T.hours}],[{url:'/visa-guide?lang='+LANG,text=LANG==='en'?'Visa guide':'签证指南'}]);return}showResult('warn',LANG==='en'?'24-hour transit may be available, subject to port handling':'24小时过境可能适用，但需按口岸规定核验',LANG==='en'?'Valid international travel documents and a confirmed onward international ticket are required, subject to open-port and restricted-area rules.':'需要有效国际旅行证件和已确定座位的国际联程客票，并受开放口岸及口岸限定区域规定约束.',[{k:T.limit,v:'24 '+T.hours}],[{url:'https://en.nia.gov.cn/',text:LANG==='en'?'Verify with NIA':'核对国家移民管理局'}]);return}if(mode.value==='hainan'){var h=CONFIG.hainan||{};if(!h.enabled){showResult('bad',LANG==='en'?'Hainan visa-free entry is not verified for this country':'当前国家未核验海南免签资格','',[],[{url:'/visa-guide?lang='+LANG,text:LANG==='en'?'Visa guide':'签证指南'}]);return}if(days>30||(h.purposes||[]).indexOf(purpose)<0){showResult('bad',LANG==='en'?'The Hainan route does not match this trip':'该海南免签路径与当前行程不匹配',LANG==='en'?'The current rule is limited to eligible short-term purposes and up to 30 days in Hainan.':'当前政策限于符合条件的短期事由，且最长30天并限于海南省行政区域.',[{k:T.stay,v:days+' '+T.days},{k:T.purpose,v:purpose}],[{url:'/country/'+CODE+'?lang='+LANG,text:LANG==='en'?'Country routes':'国家路径'}]);return}showResult('ok',LANG==='en'?'Likely eligible for Hainan visa-free entry':'可能符合海南免签',LANG==='en'?'Your country is in the configured 61-country Hainan list and your purpose and stay fit the basic rule. Verify the latest official requirements before travel.':'你的国家在当前海南免签名单中，且目的和停留时间符合基本规则。出行前请核对官方最新要求.',[{k:T.region,v:T.hainan},{k:T.limit,v:'30 '+T.days}],[{url:'/country/'+CODE+'?lang='+LANG,text=LANG==='en'?'Country routes':'国家路径'}]);return}var direct=directRule(purpose,days);if(direct){if(direct.type==='mutual'){showResult('warn',LANG==='en'?'The bilateral exemption may apply — verify the exact agreement':'可能适用互免协定，但必须核对具体协定',LANG==='en'?'Bilateral agreements can have different passport, purpose, cumulative-stay and entry conditions. This checker will not treat a simple day count as a final decision.':'双边协定可能有不同的护照、目的、累计停留和入境条件，不能仅凭一次停留天数作最终判断.',[{k:T.route,v:T.mutual},{k:T.entered,v:days+' '+T.days}],[{url:direct.policyUrl+'?lang='+LANG,text:LANG==='en'?'Review agreement rules':'查看协定规则'}])}else{showResult('ok',LANG==='en'?'Likely eligible for visa-free entry':'可能符合免签入境',LANG==='en'?'Your purpose and planned stay match the listed unilateral rule for an ordinary passport. Verify the exact conditions before travel.':'你的目的和停留时间符合当前单方面免签普通护照规则。出发前请核对具体条件.',[{k:T.limit,v:direct.stayText+' '+T.days},{k:T.purpose,v:purpose}],[{url:direct.policyUrl+'?lang='+LANG,text:LANG==='en'?'View exact policy':'查看具体政策'}])}return}showResult('warn',LANG==='en'?'No verified direct visa-free route matches this trip':'没有已核验的直接免签路径匹配该行程',LANG==='en'?'Check the exact country policy or use the China visa guide.':'请核对具体国家政策或进入中国签证指南.',[{k:T.purpose,v:purpose},{k:T.stay,v:days+' '+T.days}],[{url:'/visa-guide?lang='+LANG,text:LANG==='en'?'China visa guide':'中国签证指南'}])}mode.addEventListener('change',showFields);showFields();document.getElementById('check-btn').addEventListener('click',check);if(window.location.hash==='#eligibility-checker'){setTimeout(function(){document.getElementById('eligibility-checker').scrollIntoView({behavior:'smooth'})},60)}</script>
