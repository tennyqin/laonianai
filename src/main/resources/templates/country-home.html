<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${lang=='en' ? countrySeoTitleEn : countrySeoTitleZh}">China Visa Guide</title>
<meta name="description" th:content="${lang=='en' ? countrySeoDescEn : countrySeoDescZh}">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<script type="application/ld+json" th:utext="${structuredData}"></script>
<link rel="canonical" th:href="${canonicalUrl}">
<link rel="alternate" hreflang="en" th:href="${hreflang['en']}">
<link rel="alternate" hreflang="zh" th:href="${hreflang['zh']}">
<link rel="alternate" hreflang="x-default" th:href="${hreflang['x-default']}">
<link rel="stylesheet" href="/css/index.css?20260906">
<link rel="stylesheet" href="/css/country-detail.css?20260906">
<link rel="stylesheet" href="/css/footer.css?20260906">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<div th:replace="~{common/ga :: google-analytics}"></div>
<style>
.page{max-width:980px;margin:auto}.hero{padding:30px 26px;background:#fff;border:1px solid #d1fae5;border-radius:20px;margin:18px 0}.country-heading{display:flex;align-items:center;gap:12px}.country-flag{font-size:42px;line-height:1}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#047857;font-weight:800}.hero h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:8px 0 12px}.question{font-size:20px;font-weight:750;margin:0 0 8px}.answer,.intro,.muted{color:#64748b;line-height:1.7}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}.stat{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:14px}.stat b{display:block;font-size:11px;color:#64748b;margin-bottom:5px}.stat span{font-weight:800}.box{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:23px;margin:18px 0}.box h2{margin:0 0 6px}.checker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.field label{display:block;font-size:13px;font-weight:750;color:#374151}.field select,.field input{width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #d1d5db;border-radius:11px;background:#fff;font-size:14px}.help{font-size:12px;color:#64748b;line-height:1.5;margin-top:5px;display:block}.conditional{display:none}.check-btn{margin-top:17px;width:100%;border:0;border-radius:11px;padding:14px;background:#059669;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.result{display:none;margin-top:17px;padding:18px;border-radius:14px;border:1px solid #d1d5db;background:#f8fafc}.result.ok{background:#ecfdf5;border-color:#a7f3d0}.result.warn{background:#fffbeb;border-color:#fde68a}.result.bad{background:#fef2f2;border-color:#fecaca}.transit24-tip{margin-top:14px;padding:13px 15px;border:1px solid #bfdbfe;background:#eff6ff;border-radius:12px;color:#1e3a8a;line-height:1.65;font-size:13px}.transit24-tip strong{display:block;margin-bottom:3px;color:#1d4ed8}.result-title{font-size:19px;font-weight:850;margin-bottom:6px}.result-text{color:#475569;line-height:1.7}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.summary div{background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:10px;font-size:12px}.summary b{display:block;color:#64748b;font-size:10px;margin-bottom:3px}.links,.related{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.links a,.related a{padding:9px 12px;border:1px solid #d1d5db;border-radius:9px;background:#fff;color:#047857;text-decoration:none;font-weight:750;font-size:13px}.route-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:15px}.route{display:flex;flex-direction:column;min-height:165px;border:1px solid #dfe7e4;border-radius:16px;padding:18px;text-decoration:none;color:#1f2937;background:#fff}.route-icon{width:38px;height:38px;border-radius:11px;background:#ecfdf5;color:#047857;display:flex;align-items:center;justify-content:center;margin-bottom:12px}.route strong{font-size:18px;margin-bottom:7px}.route-meta{font-size:13px;color:#64748b;line-height:1.6}.route-cta{margin-top:auto;padding-top:13px;color:#047857;font-size:13px;font-weight:800}.faq details{border-top:1px solid #e5e7eb;padding:13px 0}.faq summary{cursor:pointer;font-weight:750}.source{font-size:12px;color:#64748b;line-height:1.6}@media(max-width:720px){.stats,.checker-grid,.summary{grid-template-columns:1fr}.hero,.box{padding:19px 16px}.country-flag{font-size:34px}}
.intent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.intent-card{padding:14px;border:1px solid #e5e7eb;border-radius:12px;background:#f8fafc}.intent-card strong{display:block;font-size:13px;margin-bottom:5px}.intent-card span{display:block;color:#64748b;line-height:1.6;font-size:13px}@media(max-width:720px){.intent-grid{grid-template-columns:1fr}}
.decision-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:20px;font-weight:900;letter-spacing:.04em;margin:14px 0 8px}.decision-badge.yes{background:#dcfce7;color:#166534;border:1px solid #86efac}.decision-badge.no{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}.decision-answer{margin:0 0 6px;color:#0f172a;font-size:17px;font-weight:800;line-height:1.55}.decision-note{margin:0;color:#475569;line-height:1.65}.route-answer{margin-top:16px;padding:15px 16px;border:1px solid #a7f3d0;background:#f0fdf4;border-radius:14px}.route-answer>strong{display:block;color:#065f46;font-size:15px;margin-bottom:9px}.route-check-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.route-check{display:block;padding:10px 11px;border-radius:10px;background:#fff;border:1px solid #bbf7d0;color:#047857;text-decoration:none;font-weight:750;line-height:1.45}.route-check:hover{border-color:#34d399}.route-jump{display:inline-block;margin-top:10px;color:#047857;font-size:13px;font-weight:750;text-decoration:none}.stat-link{text-decoration:none;color:#1f2937}.stat-link:hover{border-color:#86efac}.route-check:focus-visible,.route-jump:focus-visible,.stat-link:focus-visible{outline:3px solid rgba(16,185,129,.25);outline-offset:2px}@media(max-width:720px){.decision-badge{font-size:18px}.route-check-list{grid-template-columns:1fr}.route-answer{padding:13px}.route-check{min-height:44px;display:flex;align-items:center}}
.result p{margin:10px 0;line-height:1.65}.result ul{padding-left:22px;margin:12px 0}.result h3{line-height:1.35}.check-btn:disabled{opacity:.6;cursor:wait}#eligibility-checker,#stay-calculator{scroll-margin-top:84px}</style>
</head>
<body>
<div th:replace="~{common/header :: site-header}"></div>
<div class="container page">
<div class="breadcrumb-wrap"><div class="breadcrumb"><a th:href="@{/(lang=${lang})}" th:text="${lang=='en'?'Home':'首页'}"></a><span class="sep">/</span><span class="current" th:text="${lang=='en'?detailCountry.name:detailCountry.nameZh}"></span></div></div>
<section class="hero"><div class="country-heading"><span class="country-flag" aria-hidden="true" th:text="${countryFlag}">🌐</span><div><div class="eyebrow" th:text="${lang=='en'?'Visa-free & entry options':'免签及入境政策'}"></div><h1 th:text="${lang=='en'?countryIntent['homeHeroQuestionEn']:countryIntent['homeHeroQuestionZh']}"></h1></div></div><div class="decision-badge" th:classappend="${directDecisionYes?' yes':' no'}" th:text="${directDecisionYes?(lang=='en'?'Direct route listed':'列有直接路径'):(lang=='en'?'Check other routes / dates':'核对其他路径或日期')}"></div><p class="decision-answer" th:text="${countryDecisionAnswer}"></p><p class="decision-note" th:text="${countryDecisionText}"></p><p><a class="check-btn" href="#eligibility-checker" data-action="country_checker_open" style="display:inline-block;width:auto;text-decoration:none" th:text="${lang=='en'?'Check my dates and trip →':'核对我的日期和行程 →'}"></a></p><div class="route-answer"><strong th:text="${routeCountText}"></strong><div class="route-check-list"><a class="route-check" th:each="r:${routeChecks}" th:href="${r['url']}" th:text="${'✓ '+r['label']}"></a></div><a class="route-jump" href="#routes" th:text="${lang=='en'?'View entry routes ↓':'查看入境路径 ↓'}"></a></div><div class="stats"><a class="stat stat-link" href="#routes"><b th:text="${lang=='en'?'Entry routes':'入境路径'}"></b><span th:text="${availableTypes.size()}"></span></a><div class="stat"><b th:text="${lang=='en'?'Last verified':'最近核验'}"></b><span th:text="${lastVerified}">2026-09-13</span></div></div></section>
<section class="box" id="eligibility-checker"><h2 th:text="${lang=='en'?'Check my trip to China':'检查我的来华行程'}"></h2><p class="intro" th:text="${lang=='en'?'Check your passport, purpose, stay and itinerary against the routes listed for this country. Results are a pre-travel screening aid, not an immigration decision.':'根据你的护照、出行目的、停留时间和实际行程，核对本国籍对应的入境路径。结果仅用于出行前筛查，不等同于边检决定。'}"></p><details class="transit24-tip"><summary th:text="${lang=='en'?'Connecting through China for less than 24 hours?':'在中国中转不超过24小时？'}"></summary><strong th:text="${lang=='en'?'Good to know: 24-hour visa-free transit is available to nationals of all countries':'提示：24小时过境免签面向世界各国人员'}"></strong><span th:text="${lang=='en'?'If you are transiting through China to a third country or region, you may stay up to 24 hours without a visa if you meet the travel-document and confirmed onward-ticket conditions and remain in the port restricted area. Select this route below to check the basic conditions.':'如果你只是经中国前往第三国或地区，符合有效国际旅行证件、已确定座位的国际联程客票等条件，并且不离开口岸限定区域，通常可在中国停留不超过24小时而免办签证。可在下方选择该路径进行基础核验。'}"></span></details><p class="help" th:text="${lang=='en'?'This check uses the passport nationality shown at the top of this page, not your country of residence. Choose another country from the header if needed.':'本次使用本页所示的护照国籍，并非居住国家。如需更换国籍，请从顶部重新选择。'}"></p><div class="checker-grid">
<div class="field"><label for="passport" th:text="${lang=='en'?'1. Passport type':'1. 护照类型'}"></label><select id="passport"><option value="ordinary" th:text="${lang=='en'?'Ordinary passport':'普通护照'}"></option><option value="diplomatic" th:text="${lang=='en'?'Diplomatic / official passport':'外交 / 公务护照'}"></option><option value="other" th:text="${lang=='en'?'Other travel document':'其他旅行证件'}"></option></select></div>
<div class="field"><label for="purpose" th:text="${lang=='en'?'2. Main purpose':'2. 主要目的'}"></label><select id="purpose"><option value="tourism" th:text="${lang=='en'?'Tourism':'旅游'}"></option><option value="business" th:text="${lang=='en'?'Business':'商务'}"></option><option value="family" th:text="${lang=='en'?'Family / friends visit':'探亲访友'}"></option><option value="exchange" th:text="${lang=='en'?'Exchange visit':'交流访问'}"></option><option value="medical" th:text="${lang=='en'?'Medical treatment':'就医'}"></option><option value="conference" th:text="${lang=='en'?'Conference / exhibition':'会展'}"></option><option value="sports" th:text="${lang=='en'?'Sports competition':'体育赛事'}"></option><option value="transit" th:selected="${selectedPurpose == 'transit'}" th:text="${lang=='en'?'Transit':'过境'}"></option><option value="study_tour" th:text="${lang=='en'?'Short study tour / summer or winter camp':'短期研学 / 冬夏令营'}"></option><option value="study" th:text="${lang=='en'?'Study':'学习'}"></option><option value="work" th:text="${lang=='en'?'Work':'工作'}"></option><option value="other" th:text="${lang=='en'?'Other':'其他'}"></option></select></div>
<div class="field"><label for="days" id="duration-label" th:text="${lang=='en'?'3. Planned stay':'3. 计划停留'}"></label><input id="days" type="number" min="1" max="3650" value="7" required inputmode="numeric"><small class="help" th:text="${lang=='en'?'For complex bilateral rules, the checker will ask you to verify the agreement rather than guessing.':'对于复杂的双边互免规则，检查器会要求进一步核验，不会自行猜测。'}"></small></div>
<div class="field"><label for="entryMode" th:text="${lang=='en'?'4. Which option would you like to check?':'4. 希望核对哪种方式？'}"></label><select id="entryMode"><option value="auto" selected th:text="${lang=='en'?'Help me find a route (recommended)':'帮我选择适用路径（推荐）'}"></option><option value="direct" th:text="${lang=='en'?'Direct entry':'直接入境'}"></option><option value="transit240" th:text="${lang=='en'?'240-hour transit to a third country / region':'240小时过境前往第三国 / 地区'}"></option><option value="transit24" th:selected="${selectedEntryMode == 'transit24'}" th:text="${lang=='en'?'24-hour transit without leaving the port restricted area':'24小时过境且不离开口岸限定区域'}"></option><option value="hainan" th:text="${lang=='en'?'Hainan regional visa-free entry':'海南区域免签'}"></option></select></div>
<div class="field"><label for="entryDate" th:text="${lang=='en'?'Planned entry date (China time)':'计划入境日期（中国时间）'}"></label><input id="entryDate" type="date" required th:value="${todayChina}"><small class="help" th:text="${lang=='en'?'An unconfirmed future policy will not be treated as permission.':'尚未确认的未来政策不会作为已获准条件。'}"></small></div><div class="field"><label><input id="passportValid" type="checkbox" style="width:auto"><span th:text="${lang=='en'?'My ordinary passport remains valid for my intended stay':'我的普通护照有效期覆盖拟在华停留时间'}"></span></label></div>
<div class="field" id="departureDateField"><label for="departureDate" th:text="${lang=='en'?'Planned departure date (optional, China time)':'计划离境日期（选填，中国时间）'}"></label><input id="departureDate" type="date"><small class="help" th:text="${lang=='en'?'If entered, these dates replace the stay length above. A bilateral agreement may use a different counting rule; its deadline is not calculated here.':'填写后按入出境日期替代上方天数。双边协定可能另有计时规则，此处不计算其离境截止日。'}"></small></div>
<div class="field conditional" id="itineraryFields"><label for="origin" th:text="${lang=='en'?'Country / region immediately before China':'紧邻中国行程的前段出发国家 / 地区'}"></label><select id="origin"><option value="" th:text="${lang=='en'?'Select':'请选择'}"></option><option th:each="place:${itineraryCountries}" th:value="${place['code']}" th:text="${place['name']}"></option></select></div>
<div class="field conditional" id="transit240Fields"><label for="destination" th:text="${lang=='en'?'Country / region immediately after China':'紧邻中国行程的后一国家 / 地区'}"></label><select id="destination"><option value="" th:text="${lang=='en'?'Select the next country / region after China':'选择离开中国后的下一国家 / 地区'}"></option><option th:each="place:${itineraryCountries}" th:value="${place['code']}" th:text="${place['name']}"></option></select><label style="margin-top:9px;display:flex;gap:8px;align-items:flex-start;font-weight:600"><input id="onward" type="checkbox" style="width:auto;margin-top:3px"><span th:text="${lang=='en'?'I have confirmed onward travel evidence':'我有已确认的后续联程行程证明'}"></span></label></div>
<div class="field conditional" id="transit24Fields"><label th:text="${lang=='en'?'24-hour transit condition':'24小时过境条件'}"></label><div class="help" th:text="${lang=='en'?'Valid international travel documents and confirmed onward international travel are required.':'需要有效国际旅行证件和已确定座位的国际联程客票。'}"></div></div>
<div class="field conditional" id="hainanFields"><label th:text="${lang=='en'?'Hainan condition':'海南条件'}"></label><div class="help" th:text="${lang=='en'?'If this nationality is listed, the checker can screen the 30-day Hainan route. Final entry remains subject to the official rules.':'如果该国籍在名单中，检查器可以核验海南30天区域免签的基础条件，最终入境仍以官方规定为准。'}"></div></div>
</div><button class="check-btn" id="check-btn" type="button" th:text="${lang=='en'?'Check my trip':'检查我的行程'}"></button><div class="result" id="check-result" aria-live="polite"><div class="result-title" id="result-title"></div><div class="result-text" id="result-text"></div><div class="summary" id="result-summary"></div><div class="links" id="result-links"></div></div></section>
<section class="box" id="stay-calculator" th:if="${calculatorAvailable}"><h2 th:text="${lang=='en'?'Need just the departure deadline?':'只想计算离境日期？'}"></h2><p class="intro" th:text="${lang=='en'?'Use the entry date, purpose, passport confirmation and planned duration above. Only the verified unilateral 30-day rule is supported; bilateral and transit rules are separate.':'使用上方填写的日期、事由、护照确认和计划天数，仅计算已核实的单方面30天规则，不套用于互免或过境。'}"></p><button id="calculate-btn" class="check-btn" type="button" th:text="${lang=='en'?'Calculate departure dates':'计算离境日期'}"></button><div id="calculator-result" class="result" aria-live="polite"></div></section>
<section class="box" id="user-intent"><h2 th:text="${lang=='en'?'Key entry information':'核心入境信息'}"></h2><p class="intro" th:text="${lang=='en'?countryIntent['intentSummaryEn']:countryIntent['intentSummaryZh']}"></p><div class="intent-grid"><div class="intent-card" th:each="item:${lang=='en'?countryIntent['checksEn']:countryIntent['checksZh']}"><strong th:text="${item['k']}"></strong><span th:text="${item['v']}"></span></div></div></section>
<section class="box"><h2 th:text="${lang=='en'?'Country-specific questions':'常见入境问题'}"></h2><div class="faq"><details th:each="faq:${lang=='en'?countryIntent['faqEn']:countryIntent['faqZh']}" th:open="${faqStat.first}"><summary th:text="${faq['q']}"></summary><p class="muted" th:text="${faq['a']}"></p></details></div></section>
<section class="box" id="routes"><h2 th:text="${lang=='en'?'Listed entry routes and conditions':'名单中的入境路径及条件'}"></h2><p class="intro" th:text="${lang=='en'?countryProfile['introEn']:countryProfile['introZh']}"></p><div class="route-grid"><a class="route" th:each="policy:${availablePolicies}" th:href="@{/country/{code}/{type}(code=${code},type=${policy.policyType},lang=${lang})}"><span class="route-icon" th:text="${policy.policyType=='transit'?'↔':policy.policyType=='mutual'?'⇄':policy.policyType=='hainan'?'◉':'✓'}"></span><strong th:text="${lang=='en'?policy.policyType:policy.policyTypeZh}"></strong><div class="route-meta"><span th:text="${policy.policyType=='mutual'?(lang=='en'?'Stay and entry limits: check agreement':'停留及入境限制：以协定为准'):(lang=='en'?'Maximum listed stay: '+policy.stayDays+' days':'政策记录最长停留：'+policy.stayDays+'天')}"></span><br><span th:text="${lang=='en'?policy.purpose:policy.purposeZh}"></span></div><span class="route-cta" th:text="${lang=='en'?'View detailed rules →':'查看详细规则 →'}"></span></a></div></section>
<section class="box" th:if="${countryExtraRoot!=null && countryExtraRoot['homeImportantNotesEn']!=null}"><h2 th:text="${lang=='en'?'Important before you travel':'出行前重要提示'}"></h2><ul><li th:each="n:${lang=='en'?countryExtraRoot['homeImportantNotesEn']:countryExtraRoot['homeImportantNotesZh']}" th:text="${n}"></li></ul></section>
<section class="box" th:if="${relatedArticles!=null && !relatedArticles.isEmpty()}" id="next-steps">
<h2 th:text="${lang=='en'?'Travel guides':'出行指南'}"></h2>
<p class="intro" th:text="${lang=='en'?'Once you know the available route, these country-specific guides answer the practical questions travelers usually face next.':'确定可用入境路径后，下面的国家专属指南继续回答实际出行中最常见的下一步问题。'}"></p>
<div class="related"><a th:each="article:${relatedArticles}" th:href="@{/articles/{id}(id=${article['id']},lang=${lang})}"><span th:text="${lang=='en'?article['titleEn']:article['titleZh']}"></span></a></div>
</section>
<section class="box" id="transit24-global">
<h2 th:text="${lang=='en'?'Universal 24-hour transit option':'所有国家都可关注的24小时过境路径'}"></h2>
<p class="intro" th:text="${lang=='en'?'This is a separate general transit facility, not a country-specific policy card. China applies it to nationals of all countries at open ports when the traveler is transiting to a third country or region and meets the document, confirmed onward-ticket and restricted-area conditions.':'这是独立于本国政策的通用过境便利，并不是某个国家专属的免签名单。中国所有对外开放口岸对世界各国人员实施24小时过境免签，但必须经中国前往第三国或地区，并满足旅行证件、已确定座位的联程客票和口岸限定区域等条件。'}"></p>
<div class="pd-check">
<strong th:text="${lang=='en'?'Use the checker to screen the 24-hour route':'使用资格检查器核验24小时过境路径'}"></strong>
<p class="help" th:text="${lang=='en'?'Choose Transit as your purpose and the 24-hour transit route. A positive screening result still needs confirmation against the official port rules.':'将出行目的选择为“过境”，再选择24小时过境路径。即使基础检查通过，出发前仍需按官方口岸规则最终核验。'}"></p>
<a class="pd-cta" th:href="${transit24CheckerUrl}" style="margin-top:10px;display:block;text-align:center;padding:11px;border-radius:10px;background:#059669;color:#fff;text-decoration:none;font-weight:750;" th:text="${lang=='en'?'Check 24-hour transit →':'检查24小时过境 →'}"></a>
</div>
</section>
<section class="box" th:if="${relatedCountryCodes!=null && !relatedCountryCodes.isEmpty()}"><h2 th:text="${lang=='en'?'Related country guides':'相关国家指南'}"></h2><div class="related"><a th:each="guide : ${relatedCountryGuideNames}" th:href="@{/country/{code}(code=${guide.key},lang=${lang})}"><span aria-hidden="true" th:text="${countryFlags[guide.key] != null ? countryFlags[guide.key] : '🌐'}"></span> <span th:text="${guide.value}"></span></a></div></section>
<section class="box"><p class="source"><strong th:text="${lang=='en'?'Official verification':'官方核验'}"></strong><br><a href="https://en.nia.gov.cn/" rel="noopener noreferrer" target="_blank">China National Immigration Administration (NIA)</a><br><span th:text="${lang=='en'?'Policy information can change. Recheck the official source before travel. Check the dated source for each route.':'政策可能变化，出行前请再次核对官方信息。各路径请查阅对应核验日期和来源。'}"></span></p></section>
</div><div th:replace="~{common/footer :: footer}"></div>
<script th:inline="javascript">window.ChinaVisaPage={code:/*[[${code}]]*/"",lang:/*[[${lang}]]*/"en",selectedEntryMode:/*[[${selectedEntryMode}]]*/"",todayChina:/*[[${todayChina}]]*/""};</script>
<script th:src="@{/js/eligibility.js(v='20261017')}"></script>
</body>
</html>
