<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${lang=='en'?detail.seoTitle:detail.seoTitleZh}"></title>
<meta name="description" th:content="${lang=='en'?detail.seoDesc:detail.seoDescZh}">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="index, follow">
<script type="application/ld+json" th:utext="${structuredData}"></script>
<link rel="canonical" th:href="${canonicalUrl}"><link rel="alternate" hreflang="en" th:href="${hreflang['en']}"><link rel="alternate" hreflang="zh" th:href="${hreflang['zh']}"><link rel="alternate" hreflang="x-default" th:href="${hreflang['x-default']}">
<link rel="stylesheet" href="/css/index.css?20260906"><link rel="stylesheet" href="/css/country-detail.css?20260906"><link rel="stylesheet" href="/css/footer.css?20260906"><link rel="icon" href="/favicon.ico" type="image/x-icon"><div th:replace="~{common/ga :: google-analytics}"></div>
<style>
.pd{max-width:980px;margin:auto}.pd-hero{padding:26px 24px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;margin-bottom:18px}.pd-kicker{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#047857}.pd-hero h1{font-size:clamp(27px,4vw,40px);line-height:1.18;margin:8px 0 14px}.pd-answer{display:flex;gap:14px;align-items:center;padding:16px;border-radius:13px;background:#ecfdf5;border:1px solid #a7f3d0}.pd-answer .yes{font-size:24px;font-weight:800;color:#047857}.pd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.pd-stat{border:1px solid #e5e7eb;border-radius:11px;padding:13px}.pd-stat small{display:block;color:#6b7280;margin-bottom:5px}.pd-stat b{font-size:16px}.pd-nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.pd-nav a{padding:8px 12px;border:1px solid #e5e7eb;border-radius:999px;text-decoration:none;color:#374151;font-size:13px}.pd-nav a.active{border-color:#6ee7b7;background:#ecfdf5;color:#047857;font-weight:700}.pd-section{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:21px;margin-bottom:16px}.pd-section h2{margin-top:0}.pd-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pd-item{border:1px solid #e5e7eb;border-radius:11px;padding:13px;line-height:1.6}.pd-item strong{display:block;font-size:13px;color:#374151;margin-bottom:4px}.pd-cta{display:block;text-align:center;padding:13px;border-radius:10px;background:#059669;color:#fff;text-decoration:none;font-weight:700}.pd-muted{color:#6b7280;line-height:1.7}.pd-faq{border-top:1px solid #eee;padding:13px 0}.pd-faq-q{font-weight:700;cursor:pointer}.pd-faq-a{display:none;color:#4b5563;line-height:1.7;margin-top:8px}.pd-faq.open .pd-faq-a{display:block}@media(max-width:640px){.pd-stats,.pd-list{grid-template-columns:1fr}.pd-hero{padding:21px 17px}}
</style></head>
<body><div class="container pd">
<div class="breadcrumb-wrap"><div class="breadcrumb"><a th:href="@{/(lang=${lang})}" th:text="${lang=='en'?'Home':'首页'}"></a><span class="sep">/</span><a th:href="@{/country/{code}(code=${code},lang=${lang})}" th:text="${lang=='en'?detail.name:detail.nameZh}"></a><span class="sep">/</span><span class="current" th:text="${lang=='en'?detail.policyType:detail.policyTypeZh}"></span></div></div>
<section class="pd-hero"><div class="pd-kicker" th:text="${lang=='en'?'China Entry Policy':'中国入境政策'}"></div><h1 th:text="${lang=='en'?detail.name+' — '+detail.policyType:detail.nameZh+' — '+detail.policyTypeZh}"></h1><div class="pd-answer"><span class="yes">✓</span><div><strong th:text="${lang=='en'?'This policy may provide a visa-free entry route':'该政策可能提供免签入境路径'}"></strong><div class="pd-muted" th:text="${lang=='en'?'Eligibility depends on passport, purpose, stay and the exact conditions below.':'是否适用取决于护照、出行目的、停留时间以及下方具体条件。'}"></div></div></div><div class="pd-stats"><div class="pd-stat"><small th:text="${lang=='en'?'Maximum listed stay':'页面显示最长停留'}"></small><b th:text="${detail.stayDays+(lang=='en'?' days':' 天')}"></b></div><div class="pd-stat"><small th:text="${lang=='en'?'Purpose':'入境目的'}"></small><b th:text="${lang=='en'?detail.purpose:detail.purposeZh}"></b></div><div class="pd-stat"><small th:text="${lang=='en'?'Last verified':'最近核验'}"></small><b th:text="${policy.lastVerified}"></b></div></div></section>
<nav class="pd-nav"><a th:href="@{/country/{code}(code=${code},lang=${lang})}" th:text="${lang=='en'?'Country overview':'国家概览'}"></a><a th:each="t:${availableTypes}" th:classappend="${t==type?'active':''}" th:href="@{/country/{code}/{type}(code=${code},type=${t},lang=${lang})}" th:text="${t=='unilateral'?(lang=='en'?'Visa-Free':'单方面免签'):t=='mutual'?(lang=='en'?'Mutual exemption':'互免签证'):(lang=='en'?'Transit':'过境免签')}"></a></nav>
<section class="pd-section"><h2 th:text="${lang=='en'?'Does this policy fit your trip?':'这个政策适合你的行程吗？'}"></h2><p class="pd-muted" th:text="${lang=='en'?'Use the country eligibility checker first. This page gives the policy details to verify.':'建议先使用国家页面的资格检查器，再通过本页核对具体政策条件。'}"></p><a class="pd-cta" th:href="@{/country/{code}(code=${code},lang=${lang})#eligibility-checker}" th:text="${lang=='en'?'Check my eligibility →':'检查我的资格 →'}"></a></section>
<section class="pd-section"><h2 th:text="${lang=='en'?'Policy summary':'政策摘要'}"></h2><div class="pd-list"><div class="pd-item"><strong th:text="${lang=='en'?'Permitted purposes':'允许的出行目的'}"></strong><span th:text="${lang=='en'?policy.permittedPurposesEn:policy.permittedPurposesZh}"></span></div><div class="pd-item"><strong th:text="${lang=='en'?'Passport':'护照'}"></strong><span th:text="${lang=='en'?policy.passportTypeEn:policy.passportTypeZh}"></span></div><div class="pd-item"><strong th:text="${lang=='en'?'Passport validity':'护照有效期'}"></strong><span th:text="${lang=='en'?policy.passportValidityEn:policy.passportValidityZh}"></span></div><div class="pd-item"><strong th:text="${lang=='en'?'Entry conditions':'入境条件'}"></strong><span th:text="${lang=='en'?policy.entryCountEn:policy.entryCountZh}"></span></div></div></section>
<section class="pd-section"><h2 th:text="${lang=='en'?'Detailed rules':'详细规则'}"></h2><p th:text="${lang=='en'?detail.rule:detail.ruleZh}"></p><p th:if="${!#strings.isEmpty(lang=='en'?detail.notes:detail.notesZh)}" th:text="${lang=='en'?detail.notes:detail.notesZh}"></p><p th:if="${!#strings.isEmpty(lang=='en'?detail.ports:detail.portsZh)}"><strong th:text="${lang=='en'?'Entry ports: ':'入境口岸：'}"></strong><span th:text="${lang=='en'?detail.ports:detail.portsZh}"></span></p></section>
<section class="pd-section"><h2 th:text="${lang=='en'?'Documents and practical checks':'材料与实际核验'}"></h2><div class="pd-list"><div class="pd-item"><strong th:text="${lang=='en'?'Return / onward travel':'返程 / 后续行程'}"></strong><span th:text="${lang=='en'?policy.onwardTicketEn:policy.onwardTicketZh}"></span></div><div class="pd-item"><strong th:text="${lang=='en'?'Accommodation':'住宿信息'}"></strong><span th:text="${lang=='en'?policy.accommodationEn:policy.accommodationZh}"></span></div><div class="pd-item"><strong th:text="${lang=='en'?'Supporting documents':'辅助证明'}"></strong><span th:text="${lang=='en'?policy.financialProofEn:policy.financialProofZh}"></span></div><div class="pd-item"><strong th:text="${lang=='en'?'Staying longer':'延长停留'}"></strong><span th:text="${lang=='en'?policy.extensionRuleEn:policy.extensionRuleZh}"></span></div></div></section>
<section class="pd-section" th:if="${countryExtra!=null and countryExtra.policyExplainEn!=null and (lang=='en'?countryExtra.policyExplainEn:countryExtra.policyExplainZh)!=''}"><h2 th:text="${lang=='en'?'What this means in practice':'实际出行怎么理解'}"></h2><p th:text="${lang=='en'?countryExtra.policyExplainEn:countryExtra.policyExplainZh}"></p></section>
<section class="pd-section" th:if="${policy.faqsEn!=null and !#lists.isEmpty(lang=='en'?policy.faqsEn:policy.faqsZh)}"><h2 th:text="${lang=='en'?'Frequently asked questions':'常见问题'}"></h2><div th:each="faq:${lang=='en'?policy.faqsEn:policy.faqsZh}" class="pd-faq"><div class="pd-faq-q" tabindex="0" th:text="${faq.q}"></div><div class="pd-faq-a" th:text="${faq.a}"></div></div></section>
<section class="pd-section"><h2 th:text="${lang=='en'?'Official verification':'官方核验'}"></h2><p class="pd-muted"><span th:text="${lang=='en'?'Source: ':'来源：'}"></span><a th:href="${policy.officialSource}" target="_blank" rel="noopener noreferrer" th:text="${lang=='en'?'China National Immigration Administration (NIA)':'中国国家移民管理局（NIA）'}"></a><span> · </span><span th:text="${lang=='en'?'Last verified: ':'最近核验：'}"></span><time th:text="${policy.lastVerified}"></time></p><p class="pd-muted" th:text="${lang=='en'?'Rules can change. Recheck the official source before departure; final entry decisions are made by the competent authorities.':'政策可能变化，出行前请重新核对官方来源；最终入境决定由有关主管机关依法作出。'}"></p></section>
<section class="pd-section"><h2 th:text="${lang=='en'?'Continue planning':'继续规划行程'}"></h2><div class="doc-item"><a th:href="@{/country/{code}(code=${code},lang=${lang})}" th:text="${lang=='en'?'Back to country decision guide':'返回国家决策页'}"></a></div><div class="doc-item"><a th:href="@{/visa-guide(lang=${lang})}" th:text="${lang=='en'?'China visa application guide':'中国签证申请指南'}"></a></div></section>
</div><script>document.addEventListener('DOMContentLoaded',()=>document.querySelectorAll('.pd-faq-q').forEach(q=>{q.addEventListener('click',()=>q.parentElement.classList.toggle('open'));q.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();q.click()}})}));</script><div th:replace="~{common/footer :: footer}"></div></body></html>
