<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${lang == 'en' ? vg.meta.pageTitleEn : vg.meta.pageTitleZh}"></title>
<meta th:content="${lang == 'en' ? vg.meta.pageDescEn : vg.meta.pageDescZh}" name="description">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow">
<link rel="canonical" th:href="${canonicalUrl}"><link rel="alternate" hreflang="en" th:href="${hreflang['en']}"><link rel="alternate" hreflang="zh" th:href="${hreflang['zh']}"><link rel="alternate" hreflang="x-default" th:href="${hreflang['x-default']}">
<script type="application/ld+json" th:utext="${structuredData}"></script>
<link rel="stylesheet" href="/css/index.css?20261107-review"><link rel="stylesheet" href="/css/footer.css?20260906"><link rel="icon" href="/favicon.ico" type="image/x-icon">
<div th:replace="~{common/ga :: google-analytics}"></div>

</head>
<body class="visa-guide-page" data-page-kind="visa-guide">
<div th:replace="~{common/header :: site-header}"></div>
<div class="container" id="main-content" tabindex="-1" role="main">
<div class="hero"><h1 th:text="${lang == 'en' ? vg.intro.titleEn : vg.intro.titleZh}"></h1><p th:text="${lang == 'en' ? vg.intro.para1En : vg.intro.para1Zh}"></p><p style="margin-top:12px" th:text="${lang == 'en' ? vg.intro.para2En : vg.intro.para2Zh}"></p></div>
<section class="section trip-start" aria-labelledby="visa-route-title">
    <h2 id="visa-route-title" th:text="${lang=='en'?'Do you need a China visa for this trip?':'这次来华需要办理签证吗？'}"></h2>
    <p th:text="${lang=='en'?'Start with your passport nationality, then check the purpose, dates and route. If no visa-free route fits, use the application steps below.':'先选择护照国籍，再核对事由、日期和路线；没有适用免签路径时，再按下方流程申请签证。'}"></p>
    <div th:replace="~{common/nationality-picker :: picker('visa-country-form', 'visa-passport-country', 'country', 'visa_guide_tool_open')}"></div>
    <p><a th:href="@{/transit-check(lang=${lang})}" data-action="transit_checker_open" th:text="${lang=='en'?'Only connecting for up to 24 hours? Check the transit conditions →':'只是中转不超过24小时？核对过境条件 →'}"></a></p>
    <a href="#visa-application" th:text="${lang=='en'?'I need to apply for a visa — see the steps ↓':'我需要申请签证，查看办理步骤 ↓'}"></a>
</section>
<div class="section"><h2 class="title" th:text="${lang == 'en' ? vg.visaTypesTitleEn : vg.visaTypesTitleZh}"></h2><div class="grid"><div class="card" th:each="vt : ${vg.visaTypes}"><div><strong th:text="${lang == 'en' ? vt.titleEn : vt.titleZh}"></strong><p style="font-size:13px;color:#4b5563;margin-top:4px;" th:text="${lang == 'en' ? vt.descEn : vt.descZh}"></p></div></div></div></div>
<div class="section"><h2 class="title" th:text="${lang == 'en' ? vg.docCheckTitleEn : vg.docCheckTitleZh}"></h2><div class="grid"><div class="card" th:each="doc : ${vg.docList}"><div><strong th:text="${lang == 'en' ? doc.titleEn : doc.titleZh}"></strong><p style="font-size:13px;color:#4b5563;margin-top:4px;" th:text="${lang == 'en' ? doc.descEn : doc.descZh}"></p></div></div></div></div>
<div id="visa-application" class="section"><h2 class="title" th:text="${lang == 'en' ? vg.processTitleEn : vg.processTitleZh}"></h2><div th:each="step : ${vg.processSteps}" class="policy"><h3><span th:text="${step.num}"></span>. <span th:text="${lang == 'en' ? step.titleEn : step.titleZh}"></span></h3><p th:text="${lang == 'en' ? step.descEn : step.descZh}"></p></div><div class="alert-block disclaimer-block" style="margin-top:16px;" th:text="${lang == 'en' ? vg.processingNoteEn : vg.processingNoteZh}"></div></div>
<div id="visa-faq" class="section"><h2 class="title" th:text="${lang == 'en' ? vg.faqTitleEn : vg.faqTitleZh}"></h2><details class="policy guide-faq" th:each="item : ${vg.visaFaqs}"><summary th:text="${lang == 'en' ? item.qEn : item.qZh}"></summary><p th:text="${lang == 'en' ? item.aEn : item.aZh}"></p></details></div>
<style>.trip-start{padding:22px;background:#f0fdf4;border:1px solid #a7f3d0;border-radius:14px}.trip-start a{color:#047857}.guide-faq summary{cursor:pointer;font-weight:650;min-height:28px;line-height:1.7}.guide-faq p{line-height:1.8}#visa-application{scroll-margin-top:90px}.visa-guide-page .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}.visa-guide-page .grid .card p{font-size:14px!important;line-height:1.7}.visa-guide-page .grid .card strong{line-height:1.5}</style>
<div id="transit-24" class="alert-block" style="margin-top:18px;background:#eff6ff;border-color:#bfdbfe;"><strong th:text="${lang=='en'?'Only transiting through China?':'只是经中国过境？'}"></strong><p th:text="${lang=='en'?'A confirmed onward itinerary to a third country or region is required. Leaving the port restricted area needs temporary entry permission.':'须有前往第三国或地区的已确认后续行程；离开口岸限定区域须申请临时入境许可。'}"></p><a th:href="@{/transit-check(lang=${lang})}" data-action="transit_checker_open" style="color:#059669;font-weight:750;" th:text="${lang=='en'?'Check my 24-hour connection →':'检查我的24小时中转 →'}"></a></div>
<div style="text-align:center;margin:30px 0;"><a th:href="@{/(lang=${lang})}" style="color:#059669;font-weight:600;">← <span th:text="${lang=='en'?'Back to homepage to check visa-free eligibility':'返回首页查询免签资格'}"></span></a></div>
</div>
<div th:replace="~{common/footer :: footer}"></div>

</body></html>
