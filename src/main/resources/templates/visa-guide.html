<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title th:text="${lang == 'en' ? vg.meta.pageTitleEn : vg.meta.pageTitleZh}"></title>
<meta th:content="${lang == 'en' ? vg.meta.pageDescEn : vg.meta.pageDescZh}" name="description">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow">
<link rel="canonical" th:href="${canonicalUrl}"><link rel="alternate" hreflang="en" th:href="${hreflang['en']}"><link rel="alternate" hreflang="zh" th:href="${hreflang['zh']}"><link rel="alternate" hreflang="x-default" th:href="${hreflang['x-default']}">
<script type="application/ld+json" th:utext="${structuredData}"></script>
<link rel="stylesheet" href="/css/index.css?20260906"><link rel="stylesheet" href="/css/footer.css?20260906"><link rel="icon" href="/favicon.ico" type="image/x-icon">
<div th:replace="~{common/ga :: google-analytics}"></div>

</head>
<body>
<div th:replace="~{common/header :: site-header}"></div>
<div class="container">
<div class="hero"><h1 th:text="${lang == 'en' ? vg.intro.titleEn : vg.intro.titleZh}"></h1><p th:text="${lang == 'en' ? vg.intro.para1En : vg.intro.para1Zh}"></p><p style="margin-top:12px" th:text="${lang == 'en' ? vg.intro.para2En : vg.intro.para2Zh}"></p></div>
<div class="section"><h2 class="title" th:text="${lang == 'en' ? vg.visaTypesTitleEn : vg.visaTypesTitleZh}"></h2><div class="grid"><div class="card" th:each="vt : ${vg.visaTypes}"><div><strong th:text="${lang == 'en' ? vt.titleEn : vt.titleZh}"></strong><p style="font-size:13px;color:#4b5563;margin-top:4px;" th:text="${lang == 'en' ? vt.descEn : vt.descZh}"></p></div></div></div></div>
<div class="section"><h2 class="title" th:text="${lang == 'en' ? vg.docCheckTitleEn : vg.docCheckTitleZh}"></h2><div class="grid"><div class="card" th:each="doc : ${vg.docList}"><div><strong th:text="${lang == 'en' ? doc.titleEn : doc.titleZh}"></strong><p style="font-size:13px;color:#4b5563;margin-top:4px;" th:text="${lang == 'en' ? doc.descEn : doc.descZh}"></p></div></div></div></div>
<div class="section"><h2 class="title" th:text="${lang == 'en' ? vg.processTitleEn : vg.processTitleZh}"></h2><div th:each="step : ${vg.processSteps}" class="policy"><h3><span th:text="${step.num}"></span>. <span th:text="${lang == 'en' ? step.titleEn : step.titleZh}"></span></h3><p th:text="${lang == 'en' ? step.descEn : step.descZh}"></p></div><div class="alert-block disclaimer-block" style="margin-top:16px;" th:text="${lang == 'en' ? vg.processingNoteEn : vg.processingNoteZh}"></div></div>
<div id="visa-faq" class="section faq-section"><h2 class="title" th:text="${lang == 'en' ? vg.faqTitleEn : vg.faqTitleZh}"></h2><div class="faq-items"><div class="faq-item" th:each="item : ${vg.visaFaqs}"><div class="faq-q"><span th:text="${lang == 'en' ? item.qEn : item.qZh}"></span><span class="faq-toggle">+</span></div><div class="faq-a"><div th:text="${lang == 'en' ? item.aEn : item.aZh}"></div></div></div></div></div>
<div id="transit-24" class="alert-block" style="margin-top:18px;background:#eff6ff;border-color:#bfdbfe;"><strong th:text="${lang=='en'?'Only transiting through China?':'只是经中国过境？'}"></strong><p th:text="${lang=='en'?'Before applying for a regular visa, check whether the general 24-hour visa-free transit facility could fit your itinerary. It applies to nationals of all countries at open ports when the required transit conditions are met.':'在申请普通签证前，可以先检查你的行程是否符合24小时过境免签。该政策面向世界各国人员，但必须满足规定的过境条件。'}"></p><a th:href="@{/(lang=${lang})}" style="color:#059669;font-weight:750;" th:text="${lang=='en'?'Search your nationality on the homepage →':'返回首页搜索你的国籍 →'}"></a></div>
<div style="text-align:center;margin:30px 0;"><a th:href="@{/(lang=${lang})}" style="color:#059669;font-weight:600;">← <span th:text="${lang=='en'?'Back to homepage to check visa-free eligibility':'返回首页查询免签资格'}"></span></a></div>
</div>
<div th:replace="~{common/footer :: footer}"></div>

</body></html>
