<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 全局公共底部 · 带非空判断 + 默认值 -->
<div th:fragment="footer" class="footer">
    <!-- 站点名称：为空则显示默认名称 -->
    <span th:text="${siteName != null ? siteName : 'China Visa Free Guide 2026'}"></span> © 2026<br>

    <!-- 最后更新时间：根据语言显示，为空则显示默认更新时间 -->
    <span th:if="${lang == 'en'}">
        [[${lastUpdate != null ? lastUpdate : 'Last Updated: August 30, 2026 | CHINA NIA Official'}]]
    </span>
    <span th:if="${lang != 'en'}">
        [[${lastUpdateZh != null ? lastUpdateZh : '最后更新：2026年08月30日 | 国家移民管理局权威'}]]
    </span>

    <!-- 联系站长：JS动态拼接邮箱，防止爬虫抓取 -->
    <span style="margin-left: 8px;">|</span>
    <a href="#" id="contact-link" style="color: inherit; text-decoration: none; cursor: pointer;">
        <span th:if="${lang == 'en'}">Contact Webmaster</span>
        <span th:if="${lang != 'en'}">联系站长</span>
    </a>

    <script>
        (function() {
            var link = document.getElementById('contact-link');
            if (link) {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    // 动态拼接，避免明文暴露
                    var u = 'tennyqin1988';
                    var d = 'gmail.com';
                    window.location.href = 'mailto:' + u + '@' + d;
                });
            }
        })();
    </script>
</div>

</html>
