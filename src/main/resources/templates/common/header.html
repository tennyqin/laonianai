<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="site-header" class="site-header">
    <div class="site-header-inner">
        <a class="site-logo" th:href="@{/(lang=${lang})}" aria-label="China Visa Free Guide">China Visa Free Guide</a>
        <button class="site-nav-toggle" type="button" aria-expanded="false" aria-controls="site-primary-nav">
            <span></span><span></span><span></span>
            <span class="sr-only" th:text="${lang=='en'?'Open menu':'打开菜单'}"></span>
        </button>
        <nav id="site-primary-nav" class="site-nav" aria-label="Primary navigation">
            <a th:href="@{/(lang=${lang})}" th:classappend="${#request.requestURI=='/'?'active':''}" th:text="${lang=='en'?'Home':'首页'}"></a>
            <a th:href="@{/(lang=${lang})}" th:attrappend="href=|#unilateral|" th:text="${lang=='en'?'Unilateral':'单方面免签'}"></a>
            <a th:href="@{/(lang=${lang})}" th:attrappend="href=|#mutual|" th:text="${lang=='en'?'Mutual':'互免签证'}"></a>
            <a th:href="@{/(lang=${lang})}" th:attrappend="href=|#transit|" th:text="${lang=='en'?'Transit':'过境免签'}"></a>
            <a th:href="@{/visa-guide(lang=${lang})}" th:classappend="${#request.requestURI=='/visa-guide'?'active':''}" th:text="${lang=='en'?'Visa Guide':'签证指南'}"></a>
            <a th:href="@{/articles(lang=${lang})}" th:classappend="${#request.requestURI.startsWith('/articles')?'active':''}" th:text="${lang=='en'?'Travel Guides':'旅行指南'}"></a>
            <div class="site-lang mobile-lang" aria-label="Language">
                <a th:href="@{${#request.requestURI}(lang='en')}" th:classappend="${lang=='en'?'active':''}">EN</a>
                <span aria-hidden="true">|</span>
                <a th:href="@{${#request.requestURI}(lang='zh')}" th:classappend="${lang=='zh'?'active':''}">中文</a>
            </div>
        </nav>
        <div class="site-lang desktop-lang" aria-label="Language">
            <a th:href="@{${#request.requestURI}(lang='en')}" th:classappend="${lang=='en'?'active':''}">EN</a>
            <span aria-hidden="true">|</span>
            <a th:href="@{${#request.requestURI}(lang='zh')}" th:classappend="${lang=='zh'?'active':''}">中文</a>
        </div>
    </div>
    <style>
        .site-header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:1000;box-shadow:0 1px 3px rgba(0,0,0,.04)}
        .site-header-inner{max-width:1180px;margin:0 auto;min-height:62px;padding:0 18px;display:flex;align-items:center;gap:22px}
        .site-logo{font-weight:850;color:#064e3b;text-decoration:none;white-space:nowrap;font-size:16px}
        .site-nav{display:flex;align-items:center;gap:4px;flex:1}
        .site-nav>a{color:#374151;text-decoration:none;font-size:14px;font-weight:650;padding:9px 10px;border-radius:9px;white-space:nowrap;transition:.18s}
        .site-nav>a:hover,.site-nav>a.active{color:#047857;background:#ecfdf5}
        .site-lang{display:flex;align-items:center;gap:5px;white-space:nowrap}
        .site-lang a{color:#6b7280;text-decoration:none;font-size:13px;font-weight:700;padding:7px 8px;border-radius:7px}
        .site-lang a:hover,.site-lang a.active{color:#047857;background:#ecfdf5}
        .mobile-lang,.site-nav-toggle{display:none}
        .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
        @media(max-width:820px){
            .site-header-inner{min-height:58px;padding:8px 14px;gap:10px;position:relative}
            .site-logo{font-size:15px;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 54px)}
            .desktop-lang{display:none}
            .site-nav-toggle{display:flex;margin-left:auto;width:42px;height:42px;border:1px solid #d1fae5;background:#ecfdf5;border-radius:10px;align-items:center;justify-content:center;flex-direction:column;gap:4px;cursor:pointer;color:#047857}
            .site-nav-toggle span:not(.sr-only){display:block;width:18px;height:2px;background:#047857;border-radius:2px}
            .site-nav{display:none;position:absolute;left:10px;right:10px;top:58px;background:#fff;border:1px solid #d1fae5;border-radius:14px;padding:8px;box-shadow:0 12px 30px rgba(6,78,59,.12);flex-direction:column;align-items:stretch;gap:3px}
            .site-nav.open{display:flex}
            .site-nav>a{padding:12px 13px;font-size:14px}
            .mobile-lang{display:flex;justify-content:center;border-top:1px solid #f0fdf4;margin-top:5px;padding-top:7px}
        }
        @media(min-width:821px){.site-nav{overflow:visible}}
    </style>
    <script>
        document.addEventListener('DOMContentLoaded',function(){
            var btn=document.querySelector('.site-nav-toggle');
            var nav=document.getElementById('site-primary-nav');
            if(!btn||!nav)return;
            btn.addEventListener('click',function(){
                var open=nav.classList.toggle('open');
                btn.setAttribute('aria-expanded',open?'true':'false');
            });
            nav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){nav.classList.remove('open');btn.setAttribute('aria-expanded','false');});});
        });
    </script>
</header>
</body>
</html>
