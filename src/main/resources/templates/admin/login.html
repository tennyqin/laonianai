<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>后台登录 - 老年AI助手</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {font-family:"Microsoft YaHei";background:#f7f9fc;}
        .login-box {width:400px;margin:100px auto;background:#fff;padding:30px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
        .title {text-align:center;font-size:24px;margin-bottom:20px;color:#333;}
        .form-item {margin-bottom:20px;}
        .form-item label {display:block;margin-bottom:5px;color:#666;}
        .form-item input {width:100%;padding:10px;border:1px solid #eee;border-radius:5px;font-size:16px;}
        .btn {width:100%;padding:10px;background:#007aff;color:#fff;border:none;border-radius:5px;font-size:16px;cursor:pointer;}
        .error {color:red;text-align:center;margin-top:10px;}
    </style>
</head>
<body>
<div class="login-box">
    <div class="title">老年AI助手 - 后台登录</div>
    <div class="form-item">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名">
    </div>
    <div class="form-item">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码">
    </div>
    <button class="btn" onclick="login()">登录</button>
    <div class="error" id="errorMsg"></div>
</div>

<script>
    function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        if (!username || !password) {
            document.getElementById('errorMsg').innerText = "用户名和密码不能为空";
            return;
        }
        fetch('/admin/doLogin', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `username=${username}&password=${password}`
        }).then(res => res.json()).then(data => {
            if (data.code === 200) {
                location.href = '/admin/cms/index';
            } else {
                document.getElementById('errorMsg').innerText = data.msg;
            }
        });
    }
</script>
</body>
</html>
