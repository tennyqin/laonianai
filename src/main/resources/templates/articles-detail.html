<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${lang == 'en' ? article.titleEn : article.titleZh}"></title>
    <meta name="description" th:content="${lang == 'en' ? article.summaryEn : article.summaryZh}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="application/ld+json"
            th:utext="${structuredData}">
    </script>
    <meta name="robots" content="index,follow">
    <link rel="canonical" th:href="${canonicalUrl}">

    <link rel="alternate"
          hreflang="en"
          th:href="${hreflang['en']}">

    <link rel="alternate"
          hreflang="zh"
          th:href="${hreflang['zh']}">

    <link rel="alternate"
          hreflang="x-default"
          th:href="${hreflang['x-default']}">
    <link rel="stylesheet" href="/css/index.css?20260903">
    <link rel="stylesheet" href="/css/country-detail.css?20260903">
    <link rel="stylesheet" href="/css/footer.css?20260903">
    <link rel="stylesheet" href="/css/art-detail.css?202609042">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <div th:replace="~{common/ga :: google-analytics}"></div>
</head>
<body>
<div class="header">
    <div class="container header-inner">
        <a th:href="|/?lang=${lang}|" class="logo">China Visa Free Guide 2026</a>
        <div class="nav">
            <a th:href="|/?lang=${lang}|" th:text="${lang=='en'?'Home':'首页'}"></a>
            <a th:href="|/?lang=${lang}#unilateral|" th:text="${lang == 'en' ? 'Unilateral' : '单方面免签'}"></a>
            <a th:href="|/?lang=${lang}#mutual|" th:text="${lang == 'en' ? 'Mutual' : '互免签证'}"></a>
            <a th:href="|/?lang=${lang}#transit|" th:text="${lang == 'en' ? 'Transit' : '过境免签'}"></a>
            <a th:href="|/articles?lang=${lang}|" style="color:#059669;font-weight:bold;" th:text="${lang == 'en' ? 'Travel Guides' : '旅行指南'}"></a>
            <a th:href="|/visa-guide?lang=${lang}|" th:text="${lang == 'en' ? 'Apply for Visa' : '签证申请指南'}"></a>
            <span class="lang">
                <a th:href="@{${#request.requestURI}(lang='en')}" th:classappend="${lang == 'en' ? 'active' : ''}">EN</a> |
                <a th:href="@{${#request.requestURI}(lang='zh')}" th:classappend="${lang == 'zh' ? 'active' : ''}">中文</a>
            </span>
        </div>
    </div>
</div>
<div class="container">
    <div class="breadcrumb-wrap">
        <div class="breadcrumb">
            <a th:href="@{/(lang=${lang})}" th:text="${lang == 'en' ? 'Home' : '首页'}"></a>
            <span class="sep">/</span>
            <a th:href="@{/articles(lang=${lang})}" th:text="${lang == 'en' ? 'Travel Guides' : '旅行指南'}"></a>
            <th:block th:if="${(lang == 'en' ? article.categoryEn : article.categoryZh) != null and !#strings.isEmpty(lang == 'en' ? article.categoryEn : article.categoryZh)}">
                <span class="sep">/</span>
                <a th:href="@{/articles(lang=${lang},category=${lang == 'en' ? article.categoryEn : article.categoryZh})}"
                   th:text="${lang == 'en' ? article.categoryEn : article.categoryZh}"></a>
            </th:block>
            <span class="sep">/</span>
            <span class="current" th:text="${lang=='en' ? article.titleEn : article.titleZh}"></span>
        </div>
    </div>
    <div class="card">
        <h1 class="title" th:text="${lang=='en' ? article.titleEn : article.titleZh}"></h1>
        <div class="article-meta">
            <span th:text="${lang == 'en' ? 'Published: ' : '发布时间：'}"></span>
            <span th:text="${article['displayPublishDate']}"></span>
        </div>
        <div class="article-content" th:utext="${lang == 'en' ? article.contentEn : article.contentZh}"></div>
    </div>

    <!-- 推荐阅读：5篇随机文章 -->
    <div class="card">
        <!-- 顶部黄色提示条：优化友好SEO文案 -->
        <div class="alert-block expiry-block" style="padding:10px 14px;margin:-20px -20px 18px -20px;border-radius:12px 12px 0 0;font-size:13px;overflow:hidden;box-sizing:border-box;">
            <span th:text="${lang == 'en' ? '💡 You may also be interested in these practical travel articles' : '💡 你可能也感兴趣的实用旅行文章'}"></span>
        </div>
        <h3 th:text="${lang == 'en' ? 'Recommended Reads' : '推荐阅读'}" style="margin: 4px 4px 12px 4px;"></h3>
        <div id="recommended-article-list">
            <!-- 加载占位美化 -->
            <div style="padding:12px 0;color:#666;text-align:center;" th:text="${lang == 'en' ? 'Loading articles...' : '文章加载中...'}"></div>
        </div>
    </div>

    <style>
        .card {
            overflow: hidden;
        }
        @media(max-width: 640px) {
            .alert-block.expiry-block {
                margin: -16px -16px 14px -16px !important;
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', async function(){
          const container = document.querySelector('#recommended-article-list');
          // 分类标签颜色映射，以英文categoryEn作为key
          const categoryColorMap = {
            "Visa-Free Tips": "#059669",
            "China Life & Apps": "#2563EB",
            "Travel Customs": "#d97706",
            "Border-Inspection Pitfalls": "#dc2626"
          };
          const defaultColor = "#059669";

          try{
            const res = await fetch('/api/articles/random?limit=5');
            if(!res.ok) throw new Error('fetch fail');
            const list = await res.json();
            const lang = "[[${lang}]]";

            const html = list.map(art=>{
              const title = lang === 'en' ? art.titleEn : art.titleZh;
              const category = lang === 'en' ? art.categoryEn : art.categoryZh;
              const catKey = art.categoryEn || "";
              const labelColor = categoryColorMap[catKey] || defaultColor;
              return `
         <div class="rec-article-item" style="border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:0 4px 12px 4px;background:#fbfdfc;transition:0.22s;box-sizing:border-box;">
             <div style="font-size:11px;color:${labelColor};margin-bottom:6px;font-weight:500;">${category}</div>
             <a href="/articles/${art.id}?lang=${lang}" style="font-size:14px;font-weight:500;color:#111827;text-decoration:none;display:block;line-height:1.5;word-break:break-word;">${title}</a>
         </div>`;
            }).join('');

            container.innerHTML = html;

            // class选择器替代匹配style字符串，hover逻辑更稳定
            container.onmouseover = function(e){
                const item = e.target.closest('.rec-article-item');
                if(item){
                    item.style.borderColor='#a7f3d0';
                    item.style.boxShadow='0 2px 8px rgba(5,150,105,0.08)';
                }
            };
            container.onmouseout = function(e){
                const item = e.target.closest('.rec-article-item');
                if(item){
                    item.style.borderColor='#e5e7eb';
                    item.style.boxShadow='none';
                }
            };

          }catch(e){
            container.innerHTML = `
         <div style="padding:18px 12px;text-align:center;color:#6b7280;font-size:14px;">
             ${lang==='en'?'Recommended articles temporarily unavailable':'推荐文章暂时无法加载'}
         </div>`;
          }
        })
    </script>


    <div class="card related-links-block">
        <h3 th:text="${lang == 'en' ? 'Related links' : '相关跳转'}"></h3>
        <div class="doc-item">
            <a th:href="@{/articles(lang=${lang})}" th:text="${lang == 'en' ? '← Back to all articles' : '← 返回全部旅行指南'}"></a>
        </div>
        <div class="doc-item">
            <a th:href="@{/(lang=${lang})}" th:text="${lang == 'en' ? '← Return home page' : '← 返回网站首页'}"></a>
        </div>
    </div>
</div>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
