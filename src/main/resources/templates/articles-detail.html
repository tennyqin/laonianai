<!DOCTYPE html>
<html th:lang="${lang}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${lang == 'en' ? article.titleEn : article.titleZh}"></title>
    <meta name="description" th:content="${lang == 'en' ? article.summaryEn : article.summaryZh}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="application/ld+json" th:utext="${structuredData}"></script>
    <meta name="robots" content="index,follow">
    <link rel="canonical" th:href="${canonicalUrl}">
    <link rel="alternate" hreflang="en" th:href="${hreflang['en']}">
    <link rel="alternate" hreflang="zh" th:href="${hreflang['zh']}">
    <link rel="alternate" hreflang="x-default" th:href="${hreflang['x-default']}">
    <link rel="stylesheet" href="/css/index.css?20260905">
    <link rel="stylesheet" href="/css/country-detail.css?20260905">
    <link rel="stylesheet" href="/css/footer.css?20260905">
    <link rel="stylesheet" href="/css/art-detail.css?20260905">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <div th:replace="~{common/ga :: google-analytics}"></div>
<style>.related-article-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.related-article{display:block;border:1px solid #e5e7eb;border-radius:12px;padding:14px;text-decoration:none;color:#1f2937;background:#fbfdfc}.related-article strong{display:block;line-height:1.5;margin-bottom:5px}.related-article small{display:block;color:#64748b;line-height:1.5}@media(max-width:640px){.related-article-list{grid-template-columns:1fr}}</style>
</head>
<body th:attr="data-content-id=${article.id}">
<div th:replace="~{common/header :: site-header}"></div>
<div class="container">
    <div class="breadcrumb-wrap">
        <div class="breadcrumb">
            <a th:href="@{/(lang=${lang})}" th:text="${lang == 'en' ? 'Home' : '首页'}"></a>
            <span class="sep">/</span>
            <a th:href="@{/articles(lang=${lang})}" th:text="${lang == 'en' ? 'Travel Guides' : '旅行指南'}"></a>
            <th:block th:if="${(lang == 'en' ? article.categoryEn : article.categoryZh) != null and !#strings.isEmpty(lang == 'en' ? article.categoryEn : article.categoryZh)}">
                <span class="sep">/</span>
                <a th:href="@{/articles(lang=${lang},category=${lang == 'en' ? article.categoryEn : article.categoryZh})}"
                   th:text="${lang == 'en' ? article.categoryEn : article.categoryZh}"></a>
            </th:block>
            <span class="sep">/</span>
            <span class="current" th:text="${lang=='en' ? article.titleEn : article.titleZh}"></span>
        </div>
    </div>
    <div class="card">
        <h1 class="title" th:text="${lang=='en' ? article.titleEn : article.titleZh}"></h1>
        <div class="article-meta">
            <span th:text="${lang == 'en' ? 'Published: ' : '发布时间：'}"></span>
            <span th:text="${article['displayPublishDate']}"></span>
            <th:block th:if="${article['displayModifiedDate'] != null and !#strings.isEmpty(article['displayModifiedDate'])}">
                <span style="margin-left:10px;" th:text="${lang == 'en' ? 'Updated: ' : '更新：'}"></span>
                <span th:text="${article['displayModifiedDate']}"></span>
            </th:block>
        </div>
        <aside class="article-task" th:if="${articleToolIntent!='none'}" aria-label="Trip tools">
            <strong th:text="${articleToolIntent=='dates'?(lang=='en'?'Apply the counting rule to your travel dates':'按你的出行日期核对停留期限'):(articleToolIntent=='transit24'?(lang=='en'?'Check your actual connection':'检查你的实际中转行程'):(lang=='en'?'Check how these rules apply to your trip':'检查这些规则是否适用于你的行程'))}"></strong>
            <p th:text="${lang=='en'?'Your passport, dates and route matter. A general guide cannot confirm your individual entry permission.':'护照、日期与行程决定适用路径；通用文章不能确认个人入境许可。'}"></p>
            <a th:if="${articleToolIntent=='transit24'}" th:href="@{/transit-check(lang=${lang})}" data-action="article_tool_open" th:text="${lang=='en'?'Check a connection up to 24 hours →':'检查不超过24小时的中转 →'}"></a>
            <a th:unless="${articleToolIntent=='transit24'}" th:href="@{/(lang=${lang})}+'#trip-start-title'" data-action="article_tool_open" th:text="${lang=='en'?'Choose my passport nationality →':'选择我的护照国籍 →'}"></a>
            <th:block th:if="${articleToolIntent!='transit24' and relatedCountryNames!=null}">
                <a th:each="entry,loop:${relatedCountryNames}" th:if="${loop.index<4}" th:href="@{/country/{code}(code=${entry.key},lang=${lang})}+'#eligibility-checker'" data-action="article_tool_open" th:attr="data-country-code=${entry.key}" th:text="${entry.value}"></a>
            </th:block>
            <a th:href="@{/about(lang=${lang})}" th:text="${lang=='en'?'How we verify policy information':'我们如何核验政策'}"></a>
        </aside>
        <style>.article-task{margin:18px 0;padding:18px;border:1px solid #a7f3d0;border-radius:12px;background:#f0fdf4;line-height:1.7}.article-task a{display:inline-block;margin:5px 20px 5px 0;color:#047857;font-weight:700;min-height:30px}.article-task p{margin:8px 0}#trip-start-title{scroll-margin-top:90px}</style>
        <div class="article-content" th:utext="${lang == 'en' ? article.contentEn : article.contentZh}"></div>
    </div>
    <div class="card" th:if="${relatedCountryNames != null and !relatedCountryNames.isEmpty()}">
        <h3 th:text="${lang == 'en' ? 'Visa policy guides for this article' : '本文相关的国家签证指南'}" style="margin: 4px 4px 12px 4px;"></h3>
        <div class="related-article-list">
            <a class="related-article" th:each="entry:${relatedCountryNames}" th:href="@{/country/{code}(code=${entry.key},lang=${lang})}">
                <strong th:text="${entry.value}"></strong>
                <small th:text="${lang == 'en' ? 'Open the country decision guide and check the current entry routes.' : '进入国家决策页，查看当前适用的入境路径。'}"></small>
            </a>
        </div>
    </div>
    <div class="card" th:if="${relatedArticles != null and !relatedArticles.isEmpty()}">
        <div class="alert-block expiry-block" style="padding:10px 14px;margin:-20px -20px 18px -20px;border-radius:12px 12px 0 0;font-size:13px;overflow:hidden;box-sizing:border-box;">
            <span th:text="${lang == 'en' ? 'Practical articles related to this topic' : '与本文主题相关的实用文章'}"></span>
        </div>
        <h3 th:text="${lang == 'en' ? 'Recommended Reads' : '推荐阅读'}" style="margin: 4px 4px 12px 4px;"></h3>
        <div class="related-article-list">
            <a class="related-article" th:each="art:${relatedArticles}" th:href="@{/articles/{id}(id=${art['id']},lang=${lang})}">
                <strong th:text="${lang == 'en' ? art['titleEn'] : art['titleZh']}"></strong>
                <small th:text="${lang == 'en' ? art['summaryEn'] : art['summaryZh']}"></small>
            </a>
        </div>
    </div>
    <div class="card related-links-block">
        <h3 th:text="${lang == 'en' ? 'Related links' : '相关跳转'}"></h3>
        <div class="doc-item">
            <a th:href="@{/articles(lang=${lang})}" th:text="${lang == 'en' ? '← Back to all articles' : '← 返回全部旅行指南'}"></a>
        </div>
        <div class="doc-item">
            <a th:href="@{/(lang=${lang})}" th:text="${lang == 'en' ? '← Return home page' : '← 返回网站首页'}"></a>
        </div>
    </div>
</div>
<div th:replace="~{common/footer :: footer}"></div>
</body>
</html>
