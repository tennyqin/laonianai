<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老年AI助手 - laonianai.com</title>
    <!-- 引入公共CSS -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
<div class="container">
    <div class="title">
        <a href="/" style="text-decoration: none; color: inherit;">老年AI助手</a>
    </div>
    <div class="slogan">
        不用下载<br>
        不用打字，按住说话就能问<br>
        听不懂，AI读给您听
    </div>
    <div class="user-count">
        已有 10000+ 位长辈问题得到贴心解决
    </div>
    <div class="promise">
        ✅ 全程免费 　✅ 没有广告 　✅ 安全可靠
    </div>
    <div class="ai-card">
        <div class="ai-card-title">💬 直接问AI</div>
        <textarea class="ai-input" id="questionInput" maxlength="32"
                  placeholder="问什么都可以，例如：手机字太小"></textarea>
        <button class="btn btn-voice" id="voiceBtn"
                onmousedown="startVoice(event)"
                onmouseup="stopVoice(event)"
                onmouseleave="stopVoice(event)"
                ontouchstart="startVoice(event)"
                ontouchend="stopVoice(event)"
                ontouchcancel="stopVoice(event)">
            🔊 按住说话提问
        </button>
        <div class="voice-tip" id="voiceTip"></div>
        <button class="btn btn-send" onclick="doAsk()">发送给 AI</button>
        <div class="suggest">
            <div class="suggest-title">🔥 热门问题（点击直接问）</div>
            <div class="suggest-btns">
                <button class="suggest-btn" onclick="setQuestion('手机字体怎么调大')">手机字体怎么调大</button>
                <button class="suggest-btn" onclick="setQuestion('微信怎么发语音')">微信怎么发语音</button>
                <button class="suggest-btn" onclick="setQuestion('怎么连WiFi')">怎么连WiFi</button>
                <button class="suggest-btn" onclick="setQuestion('怎么防诈骗')">怎么防诈骗</button>
                <button class="suggest-btn" onclick="setQuestion('微信怎么视频通话')">微信怎么视频通话</button>
                <button class="suggest-btn" onclick="setQuestion('手机没声音怎么办')">手机没声音怎么办</button>
                <button class="suggest-btn" onclick="setQuestion('微信怎么发照片')">微信怎么发照片</button>
                <button class="suggest-btn" onclick="setQuestion('手机卡顿怎么清理')">手机卡顿怎么清理</button>
                <button class="suggest-btn" onclick="setQuestion('怎么查社保')">怎么查社保</button>
                <button class="suggest-btn" onclick="setQuestion('怎么交电费')">怎么交电费</button>
            </div>
        </div>
        <div class="ai-answer" id="aiAnswer">
            <div class="ai-answer-title">AI回答</div>
            <div id="answerText"></div>
            <button class="btn-read" onclick="readAnswer()">🔊 听AI朗读</button>
        </div>
    </div>
    <div class="grid">
        <div class="grid-item"><a href="/tutorial/list?category=手机使用">手机使用</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=微信使用">微信使用</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=手机安全防骗">手机安全防骗</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=社保养老金">社保养老金</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=医疗健康">医疗健康</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=生活缴费">生活缴费</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=拍照录像">拍照录像</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=语音视频通话">语音视频通话</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=网络WiFi">网络WiFi</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=出行交通">出行交通</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=手机设置">手机设置</a></div>
        <div class="grid-item"><a href="/tutorial/list?category=日常实用工具">日常实用工具</a></div>
    </div>
    <div class="favorite-tip">
        <div style="font-weight:bold;margin-bottom:10px;">💖 好用请收藏</div>
        <div>点浏览器右上角 <b>收藏</b>，下次直接打开</div>
        <div style="margin-top:10px;color:#007aff;font-weight:bold">laonianai.com 老年AI助手</div>
    </div>

    <!-- 引入公共尾部 -->
    <div class="footer">
        laonianai.com<br>
        字大 • 简单 • 安全 • 有耐心
    </div>
</div>

<!-- 引入公共JS -->
<script src="/js/common.js"></script>
<!-- 引入首页专属JS -->
<script src="/js/index.js"></script>
</body>
</html>
