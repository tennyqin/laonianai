# ================= 核心服务器配置 =================
server:
  port: 8080
  # 如果没有配置 HTTPS，建议关闭 HTTP/2 避免协议协商阻塞
  http2:
    enabled: true
  # Tomcat 线程池与连接优化
  tomcat:
    threads:
      max: 200
      min-spare: 50
    max-connections: 10000
    accept-count: 1000
    connection-timeout: 20000
  # 【修复】压缩配置移入 server 节点
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

# ================= Spring 核心与 Web 配置 =================
spring:
  # 【修复】取消注释，排除 DataSource 自动配置
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  # Thymeleaf 模板引擎
  thymeleaf:
    cache: true
    enabled: true
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

  # 静态资源优化
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/
      cache:
        cachecontrol:
          max-age: 2592000
          cache-public: true
      chain:
        cache: true
        compressed: true
        enabled: true

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ================= 日志配置 =================
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.boot: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ================= 监控端点配置 =================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized